<!DOCTYPE html>
<html lang="en" style="background:#0a0e13">
<head>
<meta charset="utf-8">
<title>CoreKit Browser</title>
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
:root{--bg:#0a0e13;--acc:#2dd4bf;--white:#f0f6fc;--muted:#6b7785;--muted2:#8b98a5;--font:"Segoe UI Variable Text","Segoe UI",system-ui,Arial,sans-serif;--fontd:"Segoe UI Variable Display","Segoe UI",system-ui,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:#c9d1d9;font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased;user-select:none;cursor:default}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;
  background:radial-gradient(800px 520px at 50% 30%,rgba(45,212,191,.08),transparent 65%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.logo{display:flex;align-items:center;gap:12px;animation:in .45s ease both}
.logo svg{width:36px;height:36px}
.logo b{font:600 24px var(--fontd);color:var(--white)}.logo b span{color:var(--acc)}
h1{margin:22px 0 4px;font:600 21px var(--fontd);color:var(--white);animation:in .45s .04s ease both}
.sub{color:var(--muted);margin:0 0 26px;animation:in .45s .06s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
#grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:820px;max-height:58vh;overflow:auto;padding:6px;animation:in .45s .08s ease both}
.card{width:168px;padding:20px 12px 16px;border-radius:16px;background:#10161e;border:1px solid #1a2431;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;position:relative;transition:transform .15s,border-color .15s,background .15s;outline:none}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:#2a3c50;background:#121a24}
.card.last{border-color:#1f5a52}
.av{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:700 25px var(--fontd);color:#0a0e13;background:var(--pc);box-shadow:0 0 0 3px #0e141c,0 0 0 5px var(--pc)}
.nm{font:600 14.5px var(--fontd);color:var(--white);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px i{width:7px;height:7px;border-radius:50%;background:#46515e;flex:none}.px.on{color:#5eead4}.px.on i{background:var(--acc);box-shadow:0 0 7px var(--acc)}
.run{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.6px;color:#22c55e}
.add .av{background:#18222e;box-shadow:0 0 0 3px #0e141c,0 0 0 5px #223042;color:var(--muted2)}
.add .av svg{width:26px;height:26px}
.add .nm{color:var(--muted2)}
.form{width:168px;padding:16px 12px;border-radius:16px;background:#10161e;border:1px solid #1f5a52;display:flex;flex-direction:column;gap:10px}
.form input{height:34px;border-radius:9px;border:1px solid #223042;background:#0c1219;padding:0 10px;outline:none;color:var(--white)}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--acc)}
.form.wide{width:300px;text-align:left}
.form .fl{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--muted);margin:4px 0 -4px}
.form select{height:34px;border-radius:9px;border:1px solid #223042;background:#0c1219;padding:0 8px;outline:none;color:var(--white)}
.form textarea{min-height:64px;resize:vertical;border-radius:9px;border:1px solid #223042;background:#0c1219;padding:8px 10px;outline:none;color:var(--white);font-size:12px;user-select:text;word-break:break-all}
.form .err{display:none;color:#fca5a5;font-size:12px}
.form .hint{color:var(--muted);font-size:11.5px;margin-top:-4px}.form .hint.dng{color:#fca5a5}
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--white);font-size:13px}
.tg input{display:none}.tg .sw{width:34px;height:20px;border-radius:10px;background:#223042;position:relative;flex:none;transition:background .15s}
.tg .sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#8b98a5;transition:transform .15s,background .15s}
.tg input:checked+.sw{background:#14524a}.tg input:checked+.sw::after{transform:translateX(14px);background:var(--acc)}
.tg small{display:block;color:var(--muted);font-size:11.5px}
.sws{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.swc{width:18px;height:18px;border-radius:50%;border:0;box-shadow:0 0 0 2px #0f151d;cursor:pointer}
.swc.sel{box-shadow:0 0 0 2px #0f151d,0 0 0 4px #f0f6fc}
.row{display:flex;gap:6px}
.btn{flex:1;height:32px;border-radius:8px;border:1px solid #223042;background:#151e29;cursor:pointer;font-weight:600;font-size:12.5px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04201c}
.foot{margin-top:26px;color:#4b5663;font-size:12px;display:flex;align-items:center;gap:8px;animation:in .45s .1s ease both}
.foot svg{width:14px;height:14px;stroke:var(--acc);fill:none;stroke-width:2}
@media (max-width:600px){
  body{justify-content:flex-start;padding:max(28px,env(safe-area-inset-top)) 16px 24px}
  .logo b{font-size:21px}h1{font-size:22px;margin-top:26px}.sub{font-size:13.5px;text-align:center}
  #grid{max-height:none;gap:12px;width:100%}
  .card{width:calc(50% - 6px);padding:22px 10px 16px}
  html,body{overflow:auto}
  .form,.form.wide{width:100%;padding:18px 14px}.form input,.form select{height:44px;font-size:15px}.form textarea{font-size:13px}.swc{width:26px;height:26px}.btn{height:42px;font-size:14px}
}
.opening{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,14,19,.86);font:600 15px var(--fontd);color:var(--white)}
.opening.show{display:grid}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #22303f;border-top-color:var(--acc);animation:rot .8s linear infinite;margin:0 auto 14px}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="logo"><svg viewBox="0 0 48 48"><path d="M24 5 40.5 14.5v19L24 43 7.5 33.5v-19z" fill="none" stroke="#2dd4bf" stroke-width="3.4" stroke-linejoin="round"/><path d="M24 18.5 28.8 21.3v5.4L24 29.5l-4.8-2.8v-5.4z" fill="#2dd4bf"/></svg><b>Core<span>Kit</span> Browser</b></div>
<h1>Who's browsing?</h1>
<p class="sub" id="sub">Choose a profile. Each one has its own logins and proxy, stored only on this device.</p>
<div id="grid"></div>
<div class="foot"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>Security checks run before any page opens</div>
<div class="opening" id="op"><div><div class="spin"></div><span id="opT">Opening…</span></div></div>
<script>
"use strict";
const W = window.chrome && window.chrome.webview;
const send = o => { try { W && W.postMessage(o); } catch (e) {} };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = {profiles:[], colors:[]}, adding = false, color = "";
function render() {
  const cols = S.colors.length ? S.colors : ["#2dd4bf"];
  if (!color) color = cols[(S.profiles.length + 1) % cols.length];
  const last = S.profiles.reduce((a, p) => (!a || p.lastUsed > a.lastUsed ? p : a), null);
  document.getElementById("grid").innerHTML = S.profiles.map(p => `<div class="card${last && p.id === last.id ? " last" : ""}" tabindex="0" data-id="${esc(p.id)}" style="--pc:${esc(p.color)}">${p.running ? '<span class="run">OPEN</span>' : ""}<span class="av">${esc((p.name || "P")[0].toUpperCase())}</span><span class="nm">${esc(p.name)}</span><span class="px${p.proxy ? " on" : ""}"><i></i>${p.proxy ? esc(p.proxy) : "Direct connection"}</span></div>`).join("")
    + (adding ? `<div class="form wide"><input id="nm" maxlength="32" placeholder="Profile name" value="${S.profiles.length ? "" : "Personal"}"><div class="sws">${cols.map(c => `<button class="swc${c === color ? " sel" : ""}" data-c="${c}" style="background:${c}"></button>`).join("")}</div>
        <div class="fl">CONNECTION</div>
        <select id="px"><option value="">No proxy (direct)</option>${(S.proxies || []).map(x => `<option value="${esc(x.id)}"${x.id === S.default ? " selected" : ""}>${esc(x.name)}</option>`).join("")}<option value="new">Add a proxy / VPN link…</option></select>
        <textarea id="lk" spellcheck="false" placeholder="Paste a vless://, vmess://, trojan://, ss:// or socks:// link" style="display:none"></textarea>
        <div class="err" id="err"></div>
        <div class="fl">ON START</div>
        <select id="st"><option value="restore">Continue where you left off</option><option value="newtab">Open a new tab</option><option value="page">Open a specific page…</option><option value="clear">Clear everything when closed</option></select>
        <input id="pg" spellcheck="false" placeholder="Page address, e.g. example.com" style="display:none">
        <div class="hint" id="stH">Reopens your tabs. Logins and history are kept.</div>
        <label class="tg"><input type="checkbox" id="ab" checked><span class="sw"></span><span>Ad blocker<small>Blocks ads and trackers</small></span></label>
        <div class="row">${S.profiles.length ? '<button class="btn" data-a="cancel">Cancel</button>' : ''}<button class="btn pri" data-a="create">Create &amp; check</button></div></div>`
      : `<div class="card add" tabindex="0" data-a="add"><span class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="nm">Add profile</span><span class="px">&nbsp;</span></div>`);
  if (adding) document.getElementById("nm").focus();
  else { const l = document.querySelector(".card.last") || document.querySelector(".card"); if (l && document.activeElement === document.body) l.focus(); }
}
function fieldErr(msg, el) {
  const er = document.getElementById("err"); if (!er) return false;
  er.textContent = msg; er.style.display = msg ? "block" : "none";
  if (el) document.getElementById(el)?.focus();
  return true;
}
function create() {
  const n = document.getElementById("nm").value.trim(); if (!n) { document.getElementById("nm").focus(); return; }
  const px = document.getElementById("px").value, link = document.getElementById("lk").value.trim();
  if (px === "new" && !link) { fieldErr("Paste the proxy link first.", "lk"); return; }
  const st = document.getElementById("st").value, pg = document.getElementById("pg").value.trim();
  if (st === "page" && !pg) { fieldErr("Type the page to open at start.", "pg"); return; }
  fieldErr("");
  document.getElementById("opT").textContent = "Creating " + n + "…"; document.getElementById("op").classList.add("show");
  send({t:"new", name:n, color, id:px, link:px === "new" ? link : "", on:document.getElementById("ab").checked, engine:st, url:st === "page" ? pg : ""});
}
document.getElementById("grid").addEventListener("input", e => { if (e.target.id === "lk") fieldErr(""); });
document.getElementById("grid").addEventListener("change", e => {
  if (e.target.id === "st") {
    const v = e.target.value, h = document.getElementById("stH");
    document.getElementById("pg").style.display = v === "page" ? "block" : "none"; if (v === "page") document.getElementById("pg").focus();
    h.textContent = {restore:"Reopens your tabs. Logins and history are kept.", newtab:"Starts fresh. Logins and history are kept.", page:"Starts with this page. Logins and history are kept.", clear:"Signs you out and erases cookies, history, cache and tabs each time the browser closes."}[v];
    h.classList.toggle("dng", v === "clear"); fieldErr("");
  }
  if (e.target.id === "px") { const nw = e.target.value === "new"; document.getElementById("lk").style.display = nw ? "block" : "none"; fieldErr(""); if (nw) document.getElementById("lk").focus(); }
});
function open(id) {
  const p = S.profiles.find(x => x.id === id);
  document.getElementById("opT").textContent = "Opening " + (p ? p.name : "profile") + "…";
  document.getElementById("op").classList.add("show");
  send({t:"open", id});
}
document.getElementById("grid").addEventListener("click", e => {
  const c = e.target.closest("[data-c]"); if (c) { color = c.dataset.c; document.querySelectorAll(".swc").forEach(b => b.classList.toggle("sel", b === c)); return; }
  const a = e.target.closest("[data-a]");
  if (a) {
    if (a.dataset.a === "add") { adding = true; render(); }
    else if (a.dataset.a === "cancel") { adding = false; render(); }
    else if (a.dataset.a === "create") create();
    return;
  }
  const card = e.target.closest(".card[data-id]"); if (card) open(card.dataset.id);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    if (e.target.id === "nm" || e.target.id === "pg") { create(); return; }
    if (e.target.tagName === "TEXTAREA") return;
    const c = document.activeElement && document.activeElement.closest(".card");
    if (c) { c.click(); e.preventDefault(); }
  } else if (e.key === "Escape" && adding) { adding = false; render(); }
  else if (/^Arrow(Left|Right)$/.test(e.key)) {
    const cards = [...document.querySelectorAll(".card")], i = cards.indexOf(document.activeElement);
    const n = cards[(i + (e.key === "ArrowRight" ? 1 : -1) + cards.length) % cards.length]; if (n) n.focus();
  }
});
function onMsg(m) {
  if (!m) return;
  if (m.t === "state") {
    S = m;
    if (!S.profiles.length) { // first start on this device: nothing is shared between devices
      adding = true;
      document.querySelector("h1").textContent = "Create your first profile";
      document.getElementById("sub").textContent = "Profiles, logins and proxies stay on this device only. Name it, choose a proxy and the ad blocker. The security checks run before anything opens.";
    }
    render();
  }
  if (m.t === "error") { document.getElementById("op").classList.remove("show"); if (!fieldErr(m.field === "link" ? "That link could not be read: " + m.msg : m.msg, m.field === "link" ? "lk" : "nm")) alert(m.msg); }
}
if (W) W.addEventListener("message", e => onMsg(e.data));
window.__corekit = onMsg;
send({t:"ready"});
</script>
</body>
</html>

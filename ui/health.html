<!DOCTYPE html>
<html lang="en" style="background:#0a0e13">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreKit · Health Inspector</title>
<meta name="theme-color" content="#0a0e13">
<meta name="color-scheme" content="dark">
<link id="fav" rel="icon" href="data:,">
<style id="css">
:root{--bg:#0a0e13;--panel:#10161e;--line:#1a2431;--line2:#243142;--row:#151e29;--text:#c9d1d9;--white:#f0f6fc;--muted:#6b7785;--muted2:#8b98a5;--acc:#2dd4bf;--acc2:#22d3ee;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Arial,sans-serif;--fontd:"Segoe UI Variable Display","Segoe UI",system-ui,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1d2836;border-radius:6px;border:3px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:#2a3a4d}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------------- home ---------------- */
#home{position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(760px 560px at 50% 47%,rgba(45,212,191,.075),transparent 62%),var(--bg);
  transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
#home.leave{opacity:0;transform:scale(1.035);pointer-events:none}
#home.gone{display:none}
.orb{position:relative;width:300px;height:300px;animation:enter 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:scale(.9)}}
.ring,.spin{position:absolute;inset:0;width:300px;height:300px;transform:rotate(-90deg);pointer-events:none}
.ring circle{fill:none;stroke-width:8}
.ring .trk{stroke:#141d27;opacity:0;transition:opacity .6s}
.ring .prog{stroke:url(#gr);stroke-linecap:round;opacity:0;transition:opacity .6s;filter:drop-shadow(0 0 6px rgba(45,212,191,.55))}
.spin{opacity:0;transition:opacity .6s}
.spin circle{fill:none;stroke:rgba(45,212,191,.45);stroke-width:2;stroke-linecap:round}
.spin g{transform-origin:150px 150px;animation:rot 1.8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
body.scanning .ring .trk,body.scanning .ring .prog,body.done .ring .trk,body.done .ring .prog{opacity:1}
body.scanning .spin{opacity:1}
.start{position:absolute;inset:46px;border-radius:50%;border:0;cursor:pointer;outline:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#e6fffb;
  background:radial-gradient(circle at 50% 28%,#16403b 0%,#0f2126 52%,#0b151b 100%);
  box-shadow:inset 0 0 0 1.5px rgba(45,212,191,.9),inset 0 0 34px rgba(45,212,191,.13),0 0 0 12px rgba(45,212,191,.035),0 0 64px rgba(45,212,191,.22),0 24px 60px rgba(0,0,0,.5);
  transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,opacity .45s}
.start:hover{transform:scale(1.04);box-shadow:inset 0 0 0 2px rgba(45,212,191,1),inset 0 0 44px rgba(45,212,191,.2),0 0 0 14px rgba(45,212,191,.05),0 0 96px rgba(45,212,191,.38),0 24px 60px rgba(0,0,0,.5)}
.start:active{transform:scale(.985)}
.start:focus-visible{box-shadow:inset 0 0 0 2px #fff,0 0 64px rgba(45,212,191,.3)}
.start svg{width:58px;height:58px;stroke:var(--acc);stroke-width:2.2;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(45,212,191,.6))}
.start span{font:600 15px var(--fontd);letter-spacing:5px;margin-right:-5px}
.ripple{position:absolute;inset:46px;border-radius:50%;border:1.5px solid rgba(45,212,191,.42);pointer-events:none;animation:rip 3.2s cubic-bezier(.2,.6,.3,1) infinite;transition:opacity .4s}
.ripple.b{animation-delay:1.6s}
@keyframes rip{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.45);opacity:0}}
body.scanning .start,body.done .start{opacity:0;transform:scale(.82);pointer-events:none}
body.scanning .ripple,body.done .ripple{opacity:0;animation:none}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.94);transition:opacity .5s .12s,transform .6s .12s cubic-bezier(.2,.8,.2,1);pointer-events:none}
body.scanning .readout,body.done .readout{opacity:1;transform:none}
.pct{font:200 62px/1 var(--fontd);color:var(--white);font-variant-numeric:tabular-nums;letter-spacing:-1.5px;transition:opacity .3s,transform .3s}
.pct small{font-size:24px;color:var(--muted);margin-left:3px;letter-spacing:0}
.step{margin-top:12px;height:18px;font-size:13.5px;color:var(--muted2);letter-spacing:.5px;transition:opacity .18s,transform .18s}
.step.swap{opacity:0;transform:translateY(5px)}
.mark{position:absolute;width:74px;height:74px;opacity:0;transform:scale(.6);transition:opacity .35s,transform .5s cubic-bezier(.2,1.4,.4,1)}
.mark path{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;filter:drop-shadow(0 0 10px rgba(45,212,191,.6))}
body.done .pct,body.done .step{opacity:0;transform:scale(.9)}
body.done .mark{opacity:1;transform:none}
body.done .mark path{transition:stroke-dashoffset .5s .15s ease-out;stroke-dashoffset:0}

/* ---------------- report shell ---------------- */
#report{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .5s ease}
#report.active{opacity:1;pointer-events:auto;transition:opacity .55s ease .28s}
.bar{flex:none;height:62px;display:flex;align-items:center;gap:8px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(12,17,23,.92)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font:600 14px var(--fontd);color:var(--white);letter-spacing:.2px}
.brand .logo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#11262a;box-shadow:inset 0 0 0 1px rgba(45,212,191,.5)}
.brand .logo svg{width:16px;height:16px;stroke:var(--acc);stroke-width:2;fill:none;stroke-linejoin:round}
.brand .mod{color:var(--muted);font-weight:500;padding-left:10px;margin-left:2px;border-left:1px solid var(--line2)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--acc);text-transform:uppercase;margin-bottom:6px}
.btn{height:34px;padding:0 13px;border-radius:8px;border:1px solid #223042;background:#111923;color:#c9d1d9;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .18s,border-color .18s,color .18s,transform .08s,box-shadow .18s}
.btn:hover{background:#172131;border-color:#2e3f55;color:var(--white)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#03201c;font-weight:600}
.btn.primary:hover{background:#5eead4;border-color:#5eead4;box-shadow:0 0 22px rgba(45,212,191,.35)}
.btn.bad{color:#fca5a5;border-color:#3b2025;background:#171114}.btn.bad:hover{background:#241518;border-color:#5a2a31;color:#fecaca}
.btn.ghost{background:transparent}
.btn .tag{font-size:10px;font-weight:700;letter-spacing:.6px;padding:2px 6px;border-radius:5px;margin-left:2px}
.vsep{width:1px;height:22px;background:var(--line2);margin:0 6px}
.scroll{flex:1;overflow:auto}

/* ---------------- report ---------------- */
.rep{max-width:1260px;margin:0 auto;padding:26px 28px 44px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
.ttl{font:600 25px/1.2 var(--fontd);color:var(--white);letter-spacing:-.3px}
.meta{color:var(--muted);font-size:12.5px;margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--muted2);font-weight:500}
.verdict{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 15px;border-radius:999px;font:700 11.5px var(--font);letter-spacing:1px;border:1px solid;white-space:nowrap}
.verdict i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.card{background:linear-gradient(180deg,#111822,#0e141c);border:1px solid var(--line);border-radius:12px;padding:18px 20px;animation:rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.static .card,.static .track i,.static .g-val{animation:none!important}
.ct{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.ov{display:flex;align-items:center;gap:30px}
.gauges{display:flex;gap:30px;align-items:center;padding:4px 6px}
.gauge{position:relative;display:flex;flex-direction:column;align-items:center}
.gauge svg{display:block;transform:rotate(-90deg)}
.g-trk{fill:none;stroke:#161f2a}
.g-val{fill:none;stroke-linecap:round;animation:gfill 1.4s cubic-bezier(.2,.8,.2,1) both;animation-delay:.15s}
@keyframes gfill{from{stroke-dashoffset:var(--c)}}
.g-num{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;font-family:var(--fontd);font-weight:600;color:var(--white);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.g-lbl{margin-top:9px;font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.specs{flex:1;border-left:1px solid var(--line);padding-left:30px;display:grid;grid-template-columns:auto 1fr;gap:9px 22px;font-size:13px;align-content:center}
.specs dt{color:var(--muted)}.specs dd{margin:0;color:var(--white)}
.grid2{display:grid;grid-template-columns:1.12fr 1fr;gap:16px;margin-top:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.sgrp{font-weight:600;color:var(--white);font-size:12.5px;padding:12px 0 5px}
.sgrp:first-of-type{padding-top:2px}
.srow{display:grid;grid-template-columns:150px 1fr 34px 72px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--row);font-size:13px}
.srow .n{color:var(--muted2)}
.srow .s{text-align:right;color:var(--white);font-weight:600;font-variant-numeric:tabular-nums}
.srow .g{font-size:12px;font-weight:500}
.track{height:6px;background:#17212c;border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes grow{from{width:0}}
.pill{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.7px;border:1px solid;white-space:nowrap}
.issue{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--row);font-size:13px;align-items:start}
.issue:first-of-type{border-top:0;padding-top:2px}
.issue .c{color:var(--muted);font-size:11.5px;margin-bottom:2px}
.issue .t{color:var(--white)}
.none{display:flex;align-items:center;gap:10px;color:var(--white);padding:4px 0}
.test{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--row);cursor:pointer;font-size:13px}
.test:first-of-type{border-top:0;padding-top:2px}
.test .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:#151e29;color:var(--muted2);transition:color .2s,background .2s}
.test:hover .ic{color:var(--acc);background:#132a2b}
.test .tn{flex:1;color:var(--white)}
.test .td{color:var(--muted);font-size:12px;margin-right:4px}
.cols{columns:2 460px;column-gap:16px;margin-top:16px}
.cols .card{display:inline-block;width:100%;margin-bottom:16px}
.kv{width:100%;border-collapse:collapse;font-size:13px}
.kv td{padding:7px 0;border-top:1px solid var(--row);vertical-align:top}
.kv tr:first-child td{border-top:0;padding-top:0}
.kv td.k{color:var(--muted2);width:43%;padding-right:14px}
.kv td.k.ind{padding-left:14px}
.kv td.v{color:var(--white);word-break:break-word}
.kv tr.h td{color:var(--white);font-weight:600;padding-top:14px}
.kv tr.h:first-child td{padding-top:0}
.kv tr.h span{color:var(--muted);font-weight:400;margin-left:8px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;vertical-align:1px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}.ov{flex-direction:column;align-items:flex-start}.specs{border-left:0;padding-left:6px}}
/* phones (Android app) */
@media (max-width:600px){
.bar{height:auto;min-height:56px;flex-wrap:wrap;padding:8px 10px;gap:6px;position:relative}
.brand{flex:1;min-width:0;margin:0;font-size:0;gap:8px}
.brand .mod{font:600 16px var(--fontd);color:var(--white);border:0;padding:0;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .logo{width:30px;height:30px}
.brand .back+.logo{display:none}
.brand .back{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--white);display:grid;place-items:center;margin-left:-4px}
.brand .back svg{width:22px;height:22px}
.bar>.btn{order:1;width:38px;height:38px;padding:0;justify-content:center;gap:0;font-size:0;border-radius:10px;flex:none}
.bar>.btn svg{width:18px;height:18px}
#bFixAll{width:auto;padding:0 12px;gap:6px;font-size:12.5px}
#sheet{min-width:0;width:calc(100vw - 24px);padding:18px 16px 16px}
#sheet .sh-f{flex-wrap:wrap}#sheet .sh-f .btn{flex:1 1 auto;justify-content:center}#sheet .sh-f .l{flex-basis:100%;margin:0 0 4px}
.vsep{display:none}
#testBtns{order:2;flex-basis:100%;gap:6px!important;overflow-x:auto;scrollbar-width:none;padding:2px 0 2px;align-items:center}
#testBtns::-webkit-scrollbar{display:none}
#testBtns::before{content:"TESTS";font:700 10px var(--font);letter-spacing:1.4px;color:var(--muted);margin-right:2px;flex:none}
#testBtns .btn{flex:0 0 auto;height:32px;border-radius:16px;padding:0 12px;font-size:12.5px;background:#121b26}
.rep{padding:16px 12px 34px}
.gauges{gap:6px;justify-content:space-around;flex-wrap:wrap;padding:0}
.gauge svg{max-width:27vw;height:auto}
.card{padding:14px!important}
}

/* ---------------- modal / tests ---------------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(4,7,10,.62);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.sheet{background:#0f151d;border:1px solid var(--line2);border-radius:16px;box-shadow:0 40px 100px rgba(0,0,0,.65);padding:22px 24px 20px;min-width:440px;max-width:94vw;transform:translateY(12px) scale(.98);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.modal.open .sheet{transform:none}
.sh-t{font:600 17px var(--fontd);color:var(--white)}
.sh-s{color:var(--muted);font-size:13px;margin-top:3px}
.sh-f{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:20px}
.sh-f .l{margin-right:auto;color:var(--muted2);font-size:12.5px;font-variant-numeric:tabular-nums}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:18px;user-select:none}
.kr{display:flex;gap:6px}
.key{height:40px;border-radius:7px;background:#151e29;border:1px solid #1e2a39;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#93a0ad;flex:none;transition:background .15s,color .15s,box-shadow .2s,transform .08s,border-color .15s}
.key.on{background:var(--acc);border-color:var(--acc);color:#03201c;font-weight:600;box-shadow:0 0 14px rgba(45,212,191,.4)}
.key.now{transform:scale(.94)}
.key.gap{visibility:hidden}
.pad{margin-top:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;border-radius:12px;border:1px dashed #2a3a4d;cursor:crosshair}
.pad .key{height:54px;width:auto}
#scr{position:fixed;inset:0;z-index:100;background:#000;cursor:none;display:grid;place-items:center}
#tch{position:fixed;inset:0;z-index:100;background:#05080b;display:grid;touch-action:none;user-select:none}
#tch i{border:1px solid #131b25;transition:background .15s}#tch i.on{background:rgba(45,212,191,.55);border-color:rgba(45,212,191,.8)}
#tch .tbar{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:rgba(16,22,30,.94);border:1px solid var(--line2);border-radius:22px;padding:6px 6px 6px 16px;color:var(--white);font-size:13px;z-index:2}
#tch #tdone{height:30px;padding:0 14px;border-radius:15px;border:0;background:var(--acc);color:#04201c;font-weight:700}
#scr .hint{background:rgba(16,22,30,.92);color:var(--white);padding:16px 26px;border-radius:12px;font-size:14px;text-align:center;border:1px solid var(--line2);transition:opacity .5s}
.spk{display:flex;gap:26px;justify-content:center;margin:26px 0 6px}
.spk div{width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#141c26;border:1px solid var(--line2);color:var(--muted2);font-size:12px;font-weight:600;letter-spacing:1px;transition:all .25s}
.spk div svg{width:34px;height:34px}
.spk div.on{background:#123030;border-color:var(--acc);color:var(--acc);box-shadow:0 0 34px rgba(45,212,191,.35);transform:scale(1.06)}
.cam{margin-top:16px;width:640px;max-width:80vw;aspect-ratio:16/9;border-radius:12px;background:#05080b;overflow:hidden;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.meter{display:flex;gap:4px;align-items:flex-end;height:90px;margin-top:22px;padding:0 4px}
.meter i{flex:1;border-radius:3px;background:#17212c;height:8%;transition:height .08s linear,background .2s}
.meter i.on{background:var(--acc);box-shadow:0 0 10px rgba(45,212,191,.35)}

#toast{position:fixed;left:50%;bottom:26px;z-index:200;transform:translate(-50%,24px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;background:#131b25;border:1px solid var(--line2);border-radius:12px;padding:11px 14px 11px 16px;box-shadow:0 20px 50px rgba(0,0,0,.5);color:var(--white);font-size:13px;transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .d{width:8px;height:8px;border-radius:50%;background:var(--acc)}
#toast.err .d{background:#ef4444}
#toast a{color:var(--acc);cursor:pointer;font-weight:600;text-decoration:none}

/* ---------------- export / print ---------------- */
body.export{height:auto;overflow:auto}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto!important;overflow:visible!important;background:var(--bg)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #home,.bar,.modal,#toast{display:none!important}
  #report{position:static;opacity:1;display:block}
  .scroll{overflow:visible}
  .rep{padding:12mm 11mm;max-width:none}
  .card{animation:none!important;break-inside:avoid}
  .grid2{grid-template-columns:1fr 1fr}
  .cols{columns:2}
}
</style>
</head>
<body>

<section id="home">
  <div class="orb">
    <div class="ripple"></div><div class="ripple b"></div>
    <svg class="ring" viewBox="0 0 300 300">
      <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
      <circle class="trk" cx="150" cy="150" r="136"/>
      <circle class="prog" id="prog" cx="150" cy="150" r="136"/>
    </svg>
    <svg class="spin" viewBox="0 0 300 300"><g><circle cx="150" cy="150" r="118" stroke-dasharray="80 1000"/></g></svg>
    <button class="start" id="startBtn" aria-label="Start scan">
      <svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/></svg>
      <span>START</span>
    </button>
    <div class="readout">
      <div class="pct"><span id="pct">0</span><small>%</small></div>
      <div class="step" id="step">&nbsp;</div>
      <svg class="mark" viewBox="0 0 74 74"><path d="M20 38l11 11 23-24"/></svg>
    </div>
  </div>
</section>

<section id="report">
  <header class="bar">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" style="color:#2dd4bf"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><path d="M12 8.5l3 1.75v3.5L12 15.5l-3-1.75v-3.5z" fill="currentColor" stroke="none"/></svg></span>CoreKit<span class="mod">Health Inspector</span></div>
    <div id="testBtns" style="display:flex;gap:8px"></div>
    <span class="vsep"></span>
    <button class="btn ghost" id="bRescan"></button>
    <button class="btn" id="bPdf"></button>
    <button class="btn primary" id="bSave"></button>
  </header>
  <div class="scroll" id="scroll"><main class="rep" id="rep"></main></div>
</section>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"><span class="d"></span><span id="tmsg"></span><a id="tact"></a></div>

<script>
'use strict';
const TOKEN = location.pathname.split('/')[1];
const API = '/' + TOKEN + '/api/';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => x == null ? [] : Array.isArray(x) ? x : [x];
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- icons ---------- */
const I = {
  touch:'<path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 10a2 2 0 0 1 4 0v2"/><path d="M17 11a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.4L4 15a2 2 0 0 1 3.4-2l1.6 2"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  keyboard:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M10 13h4M7 16h10"/>',
  screen:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  speaker:'<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
  camera:'<path d="m23 7-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  save:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
  pdf:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h2"/>',
};
const ico = n => `<svg class="i" viewBox="0 0 24 24">${I[n]}</svg>`;

/* favicon / window icon */
(() => {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b151b"/><path d="M32 11l18.2 10.5v21L32 53 13.8 42.5v-21z" fill="none" stroke="#2dd4bf" stroke-width="4.5" stroke-linejoin="round"/><path d="M32 24l6.9 4v8L32 40l-6.9-4v-8z" fill="#2dd4bf"/></svg>`;
  $('#fav').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
})();

/* ---------- heartbeat (tells the exe the window is still open) ---------- */
const ping = () => fetch(API + 'ping', {cache:'no-store'}).catch(() => {});
ping(); setInterval(ping, 1000);
addEventListener('pagehide', () => navigator.sendBeacon(API + 'bye'));

/* ---------- scoring ---------- */
const grade = v => v >= 90 ? 'Excellent' : v >= 75 ? 'Good' : v >= 60 ? 'Fair' : v >= 40 ? 'Poor' : 'Bad';
const scol = v => v >= 85 ? '#22c55e' : v >= 70 ? '#84cc16' : v >= 55 ? '#eab308' : v >= 40 ? '#f97316' : '#ef4444';
const stcol = s => ({ok:'#22c55e', warn:'#eab308', bad:'#ef4444'})[s] || '#6b7785';
const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
const has = v => v !== null && v !== undefined && v !== '';
function weighted(list) { let tw = 0, s = 0; for (const x of list) { tw += +x.Weight; s += +x.Score * +x.Weight; } return tw ? clamp(s / tw) : null; }

let DATA = null;
const manual = {};
const ANDROID = !!window.CoreKitNative; // same screen, Android app host
const TESTS = [
  ['keyboard', 'Keyboard & Touchpad', 'keyboard'],
  ['screen', 'Screen / Dead Pixels', 'screen'],
  ['touch', 'Touch Screen', 'touch'],
  ['speakers', 'Speakers (Left / Right)', 'speaker'],
  ['webcam', 'Webcam', 'camera'],
  ['mic', 'Microphone', 'mic'],
].filter(t => !(ANDROID && t[0] === 'keyboard') && !(t[0] === 'touch' && !ANDROID && !(navigator.maxTouchPoints > 0))).map(t => ANDROID && t[0] === 'webcam' ? ['webcam', 'Camera', 'camera'] : t);

function summary() {
  const secs = arr(DATA.sections);
  const h = weighted(secs.filter(s => s.Kind === 'Health' && has(s.Score))) ?? 0;
  const p = weighted(secs.filter(s => s.Kind === 'Performance' && has(s.Score)));
  const o = p != null ? clamp(.65 * h + .35 * p) : h;
  const flags = [], warns = [];
  for (const s of secs) for (const n of arr(s.Notes)) {
    if (n.S === 'bad') flags.push({c: s.Title, t: n.T});
    else if (n.S === 'warn') warns.push({c: s.Title, t: n.T});
  }
  for (const [id, name] of TESTS) if (manual[id] && !manual[id].ok) flags.push({c: 'Hands-on Test', t: `${name} - ${manual[id].d}`});
  let v, vc;
  if (flags.length >= 3 || o < 55) { v = 'RISKY PURCHASE'; vc = '#ef4444'; }
  else if (flags.length) { v = 'ISSUES FOUND'; vc = '#f97316'; }
  else if (o >= 85) { v = 'EXCELLENT CONDITION'; vc = '#22c55e'; }
  else if (o >= 70) { v = 'GOOD CONDITION'; vc = '#84cc16'; }
  else { v = 'FAIR CONDITION'; vc = '#eab308'; }
  return {h, p, o, flags, warns, v, vc};
}

/* ---------- report rendering ---------- */
const pill = (t, c) => `<span class="pill" style="color:${c};border-color:${c}55;background:${c}14">${esc(t)}</span>`;

function gauge(v, size, sw, label) {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, off = c * (1 - v / 100), col = scol(v);
  return `<div class="gauge"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="g-trk" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}"/>
    <circle class="g-val" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="--c:${c.toFixed(2)};filter:drop-shadow(0 0 6px ${col}66)"/></svg>
    <div class="g-num" style="height:${size}px;font-size:${Math.round(size * .3)}px"><span class="cnt" data-v="${v}">${v}</span></div>
    <div class="g-lbl">${esc(label)}</div></div>`;
}

function sectionCard(s, d) {
  let o = `<div class="card" style="--d:${d}s"><div class="ct"><span>${esc(s.Title)}</span>${has(s.Score) ? pill(s.Score + ' / 100', scol(s.Score)) : ''}</div><table class="kv">`;
  for (const r of arr(s.Rows)) {
    const L = String(r.L || '');
    if (r.S === 'head') { o += `<tr class="h"><td colspan="2">${esc(L.trim())}<span>${esc(r.V)}</span></td></tr>`; continue; }
    const dot = (r.S === 'ok' || r.S === 'warn' || r.S === 'bad') ? `<span class="dot" style="background:${stcol(r.S)}"></span>` : '';
    o += `<tr><td class="k${L.startsWith('  ') ? ' ind' : ''}">${esc(L.trim())}</td><td class="v">${dot}${esc(r.V)}</td></tr>`;
  }
  return o + '</table></div>';
}

function reportHTML() {
  const sm = summary(), q = DATA.quick || {}, secs = arr(DATA.sections);
  let h = `<div class="head"><div><div class="eyebrow">CoreKit · Health Report</div><div class="ttl">${esc(q.Model || DATA.host)}</div>
    <div class="meta"><span><b>Serial</b> ${esc(q.Serial || '-')}</span><span><b>Scanned</b> ${esc(DATA.time)}</span><span><b>Host</b> ${esc(DATA.host)}</span></div></div>
    <div class="verdict" style="color:${sm.vc};border-color:${sm.vc}66;background:${sm.vc}12"><i></i>${sm.v}</div></div>`;

  h += `<div class="card" style="--d:.02s"><div class="ov"><div class="gauges">${gauge(sm.o, 150, 12, 'Overall')}${gauge(sm.h, 108, 9, 'Health')}${sm.p != null ? gauge(sm.p, 108, 9, 'Performance') : ''}</div><dl class="specs">`;
  for (const k of ['Processor', 'Memory', 'Storage', 'Graphics', 'Battery', 'Display', 'Windows', 'Android']) if (q[k]) h += `<dt>${k}</dt><dd>${esc(q[k])}</dd>`;
  h += `</dl></div></div>`;

  // component scores
  let cs = `<div class="card" style="--d:.1s"><div class="ct"><span>Component Scores</span></div>`, i = 0;
  for (const [kind, label] of [['Health', 'Condition'], ['Performance', 'Performance']]) {
    cs += `<div class="sgrp">${label}</div>`;
    for (const s of secs.filter(x => x.Kind === kind)) {
      i++;
      if (has(s.Score)) { const c = scol(s.Score);
        cs += `<div class="srow"><span class="n">${esc(s.Title)}</span><div class="track"><i style="width:${s.Score}%;background:${c};--d:${(.2 + i * .05).toFixed(2)}s"></i></div><span class="s">${s.Score}</span><span class="g" style="color:${c}">${grade(s.Score)}</span></div>`;
      } else cs += `<div class="srow"><span class="n">${esc(s.Title)}</span><div class="track"></div><span class="s" style="color:var(--muted)">--</span><span class="g" style="color:var(--muted)">N/A</span></div>`;
    }
  }
  cs += '</div>';

  // issues
  let is = `<div class="card" style="--d:.16s"><div class="ct"><span>Issues</span>${sm.flags.length + sm.warns.length ? `<span style="letter-spacing:0;text-transform:none;font-weight:500">${sm.flags.length} critical &middot; ${sm.warns.length} warning</span>` : ''}</div>`;
  if (!sm.flags.length && !sm.warns.length) is += `<div class="none"><span class="dot" style="background:#22c55e;margin:0"></span>No issues detected</div>`;
  for (const x of sm.flags) is += `<div class="issue">${pill('CRITICAL', '#ef4444')}<div><div class="c">${esc(x.c)}</div><div class="t">${esc(x.t)}</div></div></div>`;
  for (const x of sm.warns) is += `<div class="issue">${pill('WARNING', '#eab308')}<div><div class="c">${esc(x.c)}</div><div class="t">${esc(x.t)}</div></div></div>`;
  is += '</div>';

  // hands-on tests
  let ts = `<div class="card" style="--d:.22s"><div class="ct"><span>Hands-on Tests</span></div>`;
  for (const [id, name, ic] of TESTS) {
    const m = manual[id];
    const st = m ? (m.ok ? pill('PASS', '#22c55e') : pill('FAIL', '#ef4444')) : `<span class="pill" style="color:#6b7785;border-color:#243142">NOT TESTED</span>`;
    ts += `<div class="test" data-test="${id}"><span class="ic">${ico(ic)}</span><span class="tn">${esc(name)}</span>${m ? `<span class="td">${esc(m.d)}</span>` : ''}${st}</div>`;
  }
  ts += '</div>';

  h += `<div class="grid2">${cs}<div class="stack">${is}${ts}</div></div><div class="cols">`;
  secs.forEach((s, k) => { h += sectionCard(s, (.28 + k * .04).toFixed(2)); });
  return h + '</div>';
}

function countUp(el) {
  const v = +el.dataset.v, t0 = performance.now(), dur = 1300;
  const f = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(v * e); if (p < 1) requestAnimationFrame(f); };
  el.textContent = '0'; setTimeout(() => requestAnimationFrame(f), 150);
}

function render(anim) {
  const rep = $('#rep'), sc = $('#scroll'), y = sc.scrollTop;
  rep.innerHTML = reportHTML();
  rep.classList.toggle('static', !anim);
  if (anim) { sc.scrollTop = 0; rep.querySelectorAll('.cnt').forEach(countUp); } else sc.scrollTop = y;
}

/* ---------- scan flow ---------- */
const prog = $('#prog'), C = 2 * Math.PI * 136;
prog.style.strokeDasharray = C; prog.style.strokeDashoffset = C;
let target = 0, shown = 0, scanning = false, rafOn = false;
function frame() {
  if (shown < target) shown += Math.max(.12, (target - shown) * .07);
  else if (scanning && shown < Math.min(97, target + 6)) shown += .018;
  shown = Math.min(shown, 100);
  prog.style.strokeDashoffset = C * (1 - shown / 100);
  $('#pct').textContent = Math.floor(shown);
  if (scanning || shown < target) requestAnimationFrame(frame); else rafOn = false;
}
function kick() { if (!rafOn) { rafOn = true; requestAnimationFrame(frame); } }
function setStep(t) {
  const el = $('#step');
  if (el.dataset.t === t) return;
  el.dataset.t = t; el.classList.add('swap');
  setTimeout(() => { el.textContent = t; el.classList.remove('swap'); }, 180);
}

function startScan() {
  if (scanning) return;
  scanning = true; target = 0; shown = 0;
  document.body.classList.remove('done');
  document.body.classList.add('scanning');
  setStep('Preparing'); kick();
  let finished = false;
  const es = new EventSource(API + 'scan');
  es.addEventListener('progress', e => { const d = JSON.parse(e.data); target = Math.max(target, Math.min(99, d.pct)); setStep(d.label); kick(); });
  es.addEventListener('done', e => { finished = true; es.close(); DATA = JSON.parse(e.data); finish(); });
  es.addEventListener('fail', e => { finished = true; es.close(); failed(JSON.parse(e.data).error); });
  es.onerror = () => { if (!finished) { finished = true; es.close(); failed('Connection to the scanner was lost.'); } };
}

async function finish() {
  scanning = false; target = 100; kick();
  while (shown < 99.9) await sleep(30);
  document.body.classList.add('done');
  await sleep(850);
  const home = $('#home');
  home.classList.add('leave');
  render(true);
  $('#report').classList.add('active');
  await sleep(500);
  home.classList.add('gone');
  document.body.classList.remove('scanning', 'done');
}

function failed(msg) {
  scanning = false; target = 0; shown = 0;
  document.body.classList.remove('scanning', 'done');
  prog.style.strokeDashoffset = C;
  toast('Scan failed: ' + msg, true);
}

function rescan() {
  closeModal();
  $('#report').classList.remove('active');
  const home = $('#home');
  home.classList.remove('gone');
  requestAnimationFrame(() => { home.classList.remove('leave'); setTimeout(startScan, 350); });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, err, act) {
  const t = $('#toast');
  $('#tmsg').textContent = msg;
  const a = $('#tact');
  a.textContent = act ? act.label : ''; a.onclick = act ? act.fn : null;
  t.classList.toggle('err', !!err); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), act ? 6000 : 3500);
}

/* ---------- save / pdf ---------- */
function exportHTML() {
  const css = $('#css').textContent;
  const q = DATA.quick || {};
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CoreKit Health Report - ${esc(q.Model || DATA.host)}</title><style>${css} html,body{height:auto!important;overflow:auto!important}</style></head><body class="export"><main class="rep static">${reportHTML()}</main></body></html>`;
}
async function saveReport() {
  const q = DATA.quick || {}, d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `CoreKit-Health_${(q.Model || DATA.host || 'PC').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_')}_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  try {
    const N = window.CoreKitNative;
    if (N) { // Android: saved to Downloads/CoreKit
      const j = JSON.parse(N.save(name, exportHTML()));
      if (j.error) throw new Error(j.error);
      toast('Saved to ' + j.label, false, {label: 'Open', fn: () => N.open(j.path)});
      return;
    }
    const r = await fetch(API + 'save', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name, html: exportHTML()})});
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    toast('Report saved', false, {label: 'Show in folder', fn: () => fetch(API + 'reveal', {method: 'POST', body: JSON.stringify({path: j.path})})});
  } catch (e) { toast('Could not save: ' + e.message, true); }
}

/* ---------- modal ---------- */
let modalCleanup = null, modalEsc = true;
function openModal(html, cleanup, escCloses = true) {
  if (modalCleanup) { try { modalCleanup(); } catch (e) {} }
  $('#sheet').innerHTML = html; modalCleanup = cleanup || null; modalEsc = escCloses;
  $('#modal').classList.add('open');
}
function closeModal() {
  if (modalCleanup) { try { modalCleanup(); } catch (e) {} modalCleanup = null; }
  $('#modal').classList.remove('open');
}
function setResult(id, ok, d) {
  manual[id] = {ok, d}; closeModal(); render(false);
  toast(`${TESTS.find(t => t[0] === id)[1]}: ${ok ? 'passed' : 'failed'}`, !ok);
}
const foot = (id, left, failLbl = 'Not working', passLbl = 'Working') =>
  `<div class="sh-f"><span class="l" id="fl">${left || ''}</span><button class="btn ghost" data-x>Cancel</button><button class="btn bad" data-r="${id}|0">${failLbl}</button><button class="btn primary" data-r="${id}|1">${passLbl}</button></div>`;
const head = (t, s) => `<div class="sh-t">${t}</div>${s ? `<div class="sh-s">${s}</div>` : ''}`;
let resultDetail = {};
$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  if (e.target.closest('[data-x]')) { closeModal(); return; }
  const r = e.target.closest('[data-r]');
  if (r) { const [id, ok] = r.dataset.r.split('|'); setResult(id, ok === '1', (resultDetail[id] && resultDetail[id](ok === '1')) || (ok === '1' ? 'Working' : 'Not working')); }
});
addEventListener('keydown', e => { if (e.key === 'Escape' && modalEsc && $('#modal').classList.contains('open')) closeModal(); });

/* keyboard + touchpad */
const KB = (() => {
  const L = s => s.split('').map(c => [c, 'Key' + c]);
  return [
    [['Esc','Escape'], ...Array.from({length: 12}, (_, i) => ['F' + (i + 1), 'F' + (i + 1)]), ['PrtSc','PrintScreen',1.2], ['Del','Delete',1.2]],
    [['`','Backquote'], ...'1234567890'.split('').map(c => [c, 'Digit' + c]), ['-','Minus'], ['=','Equal'], ['Backspace','Backspace',2.4]],
    [['Tab','Tab',1.6], ...L('QWERTYUIOP'), ['[','BracketLeft'], [']','BracketRight'], ['\\','Backslash',1.8]],
    [['Caps','CapsLock',1.9], ...L('ASDFGHJKL'), [';','Semicolon'], ["'",'Quote'], ['Enter','Enter',2.5]],
    [['Shift','ShiftLeft',2.4], ...L('ZXCVBNM'), [',','Comma'], ['.','Period'], ['/','Slash'], ['Shift','ShiftRight',3]],
    [['Ctrl','ControlLeft',1.5], ['Win','MetaLeft',1.3], ['Alt','AltLeft',1.3], ['Space','Space',5.6], ['Alt','AltRight',1.3], ['Menu','ContextMenu',1.3], ['Ctrl','ControlRight',1.5]],
    [['Ins','Insert'], ['Home','Home'], ['PgUp','PageUp'], ['End','End'], ['PgDn','PageDown'], null, ['←','ArrowLeft'], ['↑','ArrowUp'], ['↓','ArrowDown'], ['→','ArrowRight']],
  ];
})();
function keyboardTest() {
  const U = 44, G = 6, wpx = w => Math.round(w * U + (w - 1) * G);
  let rows = '';
  for (const r of KB) {
    rows += '<div class="kr">';
    for (const k of r) rows += k ? `<div class="key" data-code="${k[1]}" style="width:${wpx(k[2] || 1)}px">${esc(k[0])}</div>` : `<div class="key gap" style="width:${wpx(.6)}px"></div>`;
    rows += '</div>';
  }
  const pad = [['b0','Left click'],['b2','Right click'],['b1','Middle click'],['wu','Scroll up'],['wd','Scroll down']].map(([c, t]) => `<div class="key" data-code="${c}">${t}</div>`).join('');
  const total = KB.flat().filter(Boolean).length, hit = new Set(), mhit = new Set();
  const upd = () => { $('#fl').textContent = `${hit.size} / ${total} keys  ·  ${mhit.size} / 5 mouse`; };
  const mark = code => { const el = $(`#sheet .key[data-code="${code}"]`); if (!el) return false; el.classList.add('on', 'now'); setTimeout(() => el.classList.remove('now'), 110); return true; };
  const kd = e => {
    if (e.target.closest && e.target.closest('.sh-f') && (e.code === 'Enter' || e.code === 'Space')) return;
    e.preventDefault(); e.stopPropagation();
    if (mark(e.code)) { hit.add(e.code); upd(); }
  };
  const ku = e => { e.preventDefault(); if (e.code === 'PrintScreen' && mark(e.code)) { hit.add(e.code); upd(); } };
  openModal(head('Keyboard & Touchpad', 'Press every key and use every touchpad button.') + `<div class="kb">${rows}</div><div class="pad" id="pad">${pad}</div>` + foot('keyboard'), () => {
    removeEventListener('keydown', kd, true); removeEventListener('keyup', ku, true);
  }, false);
  resultDetail.keyboard = () => `${hit.size}/${total} keys, ${mhit.size}/5 mouse`;
  upd();
  addEventListener('keydown', kd, true); addEventListener('keyup', ku, true);
  const padEl = $('#pad');
  padEl.addEventListener('mousedown', e => { e.preventDefault(); const c = 'b' + e.button; if (mark(c)) { mhit.add(c); upd(); } });
  padEl.addEventListener('contextmenu', e => e.preventDefault());
  padEl.addEventListener('auxclick', e => e.preventDefault());
  padEl.addEventListener('wheel', e => { e.preventDefault(); const c = e.deltaY < 0 ? 'wu' : 'wd'; if (mark(c)) { mhit.add(c); upd(); } }, {passive: false});
}

/* screen / dead pixel */
async function screenTest() {
  closeModal();
  const colors = ['#000000', '#ffffff', '#ff0000', '#00ff00', '#0000ff', '#808080', '#ffff00', '#00ffff', '#ff00ff'];
  const el = document.createElement('div'); el.id = 'scr';
  el.innerHTML = `<div class="hint">Click or press Space for the next colour &nbsp;&middot;&nbsp; Esc to exit</div>`;
  document.body.appendChild(el);
  let i = 0, done = false;
  const hint = el.firstChild; setTimeout(() => hint.style.opacity = '0', 2200);
  const end = () => {
    if (done) return; done = true;
    removeEventListener('keydown', kd, true); document.removeEventListener('fullscreenchange', fsc);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    el.remove();
    openModal(head('Screen test', 'Did you see dead or stuck pixels, lines, spots or light bleeding?') + foot('screen', '', 'Defects found', 'Screen is clean'));
    resultDetail.screen = ok => ok ? 'No defects seen' : 'Defects seen on screen';
  };
  const next = () => { hint.style.opacity = '0'; i++; if (i >= colors.length) end(); else el.style.background = colors[i]; };
  const kd = e => { e.preventDefault(); e.stopPropagation(); if (e.key === 'Escape') end(); else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') next(); };
  const fsc = () => { if (!document.fullscreenElement) end(); };
  el.addEventListener('mousedown', next);
  addEventListener('keydown', kd, true);
  try { await el.requestFullscreen({navigationUI: 'hide'}); document.addEventListener('fullscreenchange', fsc); } catch (e) {}
}

/* speakers */
function speakerTest() {
  let ctx, timers = [];
  const spk = `<div class="spk"><div id="sL">${ico('speaker')}LEFT</div><div id="sR">${ico('speaker').replace('<svg', '<svg style="transform:scaleX(-1)"')}RIGHT</div></div>`;
  openModal(head('Speakers', 'Listen for a chime on the left, then the right, then both.') + spk +
    `<div style="text-align:center;margin-top:16px"><button class="btn" id="replay">${ico('refresh')}Play again</button></div>` + foot('speakers'),
    () => { timers.forEach(clearTimeout); if (ctx) ctx.close(); });
  resultDetail.speakers = ok => ok ? 'Both channels clear' : 'Problem with sound';
  const chime = (pan, t) => {
    const p = ctx.createStereoPanner(); p.pan.value = pan; p.connect(ctx.destination);
    for (const [f, dt] of [[659.25, 0], [987.77, .15]]) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + dt); g.gain.linearRampToValueAtTime(.32, t + dt + .02); g.gain.exponentialRampToValueAtTime(.001, t + dt + 1.0);
      o.connect(g).connect(p); o.start(t + dt); o.stop(t + dt + 1.05);
    }
  };
  const light = (l, r) => { $('#sL')?.classList.toggle('on', l); $('#sR')?.classList.toggle('on', r); };
  const play = () => {
    timers.forEach(clearTimeout); timers = [];
    if (!ctx) ctx = new AudioContext();
    const t = ctx.currentTime + .1;
    chime(-1, t); chime(1, t + 1.3); chime(0, t + 2.6);
    timers.push(setTimeout(() => light(true, false), 100), setTimeout(() => light(false, true), 1400), setTimeout(() => light(true, true), 2700), setTimeout(() => light(false, false), 3900));
  };
  $('#replay').onclick = play; play();
}

/* webcam */
async function webcamTest() {
  let stream;
  openModal(head('Webcam', 'Check that the picture is clear and in focus.') + `<div class="cam" id="cam">Starting camera…</div>` + foot('webcam'),
    () => { if (stream) stream.getTracks().forEach(t => t.stop()); });
  resultDetail.webcam = ok => ok ? 'Picture OK' : 'Not working / poor picture';
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {width: 1280, height: 720}});
    const v = document.createElement('video'); v.autoplay = true; v.muted = true; v.playsInline = true; v.srcObject = stream;
    const box = $('#cam'); if (!box) { stream.getTracks().forEach(t => t.stop()); return; }
    box.textContent = ''; box.appendChild(v);
    const tr = stream.getVideoTracks()[0], st = tr.getSettings();
    $('#fl').textContent = `${tr.label || 'Camera'}${st.width ? '  ·  ' + st.width + ' x ' + st.height : ''}`;
  } catch (e) { const box = $('#cam'); if (box) box.textContent = 'No camera found, or access was blocked.'; }
}

/* microphone */
async function micTest() {
  let stream, ctx, raf, peak = false;
  const bars = '<i></i>'.repeat(36);
  openModal(head('Microphone', 'Speak or clap — the meter should move.') + `<div class="meter" id="meter">${bars}</div>` + foot('mic', 'Waiting for sound…'),
    () => { cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(t => t.stop()); if (ctx) ctx.close(); });
  resultDetail.mic = ok => ok ? 'Input detected' : 'No input detected';
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
    ctx = new AudioContext();
    const an = ctx.createAnalyser(); an.fftSize = 1024; ctx.createMediaStreamSource(stream).connect(an);
    const buf = new Float32Array(an.fftSize), hist = new Array(36).fill(0);
    const tick = () => {
      an.getFloatTimeDomainData(buf);
      let s = 0; for (const x of buf) s += x * x;
      const lvl = Math.min(1, Math.sqrt(s / buf.length) * 6);
      hist.shift(); hist.push(lvl);
      const m = $('#meter'); if (!m) return;
      [...m.children].forEach((b, i) => { b.style.height = Math.max(8, hist[i] * 100) + '%'; b.classList.toggle('on', hist[i] > .12); });
      if (lvl > .18 && !peak) { peak = true; $('#fl').innerHTML = `<span style="color:var(--acc)">● Sound detected</span>  ·  ${esc(stream.getAudioTracks()[0].label || 'Microphone')}`; }
      raf = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) { $('#fl').textContent = 'No microphone found, or access was blocked.'; }
}

/* touch screen: every area must react to the finger */
function touchTest() {
  closeModal();
  const el = document.createElement('div'); el.id = 'tch';
  const cols = innerWidth < 700 ? 6 : 12, rows = Math.max(6, Math.round(cols * innerHeight / innerWidth));
  el.style.gridTemplateColumns = `repeat(${cols},1fr)`; el.style.gridTemplateRows = `repeat(${rows},1fr)`;
  el.innerHTML = Array.from({length: cols * rows}, (_, i) => `<i data-i="${i}"></i>`).join('') +
    `<div class="tbar"><span id="tpct">0%</span><span id="tmulti">1 finger</span><button id="tdone">Done</button></div>`;
  document.body.appendChild(el);
  const cells = el.querySelectorAll('i'), hit = new Set(), active = new Set();
  let maxF = 0, done = false;
  const mark = (x, y) => {
    const c = document.elementFromPoint(x, y);
    if (c && c.tagName === 'I' && !hit.has(c.dataset.i)) { hit.add(c.dataset.i); c.className = 'on'; $('#tpct').textContent = Math.round(hit.size * 100 / cells.length) + '%'; if (hit.size === cells.length) setTimeout(end, 350); }
  };
  const end = () => {
    if (done) return; done = true; el.remove();
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    const pct = Math.round(hit.size * 100 / cells.length);
    openModal(head('Touch screen', `${pct}% of the screen reacted · up to ${maxF} finger${maxF === 1 ? '' : 's'} at once. Were there dead spots or jumpy touches?`) + foot('touch', '', 'Dead spots found', 'Touch works'));
    resultDetail.touch = ok => ok ? `${pct}% covered, ${maxF}-finger touch` : `Problems (${pct}% covered)`;
  };
  el.addEventListener('pointerdown', e => { if (e.target.id === 'tdone') return; e.preventDefault(); active.add(e.pointerId); maxF = Math.max(maxF, active.size); $('#tmulti').textContent = `${maxF} finger${maxF === 1 ? '' : 's'}`; mark(e.clientX, e.clientY); });
  el.addEventListener('pointermove', e => { if (active.has(e.pointerId)) for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) mark(ev.clientX, ev.clientY); });
  const up = e => active.delete(e.pointerId);
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  $('#tdone').onclick = end;
  if (el.requestFullscreen) el.requestFullscreen({navigationUI: 'hide'}).catch(() => {});
}

const RUN = {keyboard: keyboardTest, screen: screenTest, touch: touchTest, speakers: speakerTest, webcam: webcamTest, mic: micTest};

/* ---------- wiring ---------- */
$('#startBtn').addEventListener('click', startScan);
$('#testBtns').innerHTML = TESTS.map(([id, name, ic]) => `<button class="btn" data-run="${id}">${ico(ic)}${name.split(' ')[0].replace('Speakers', 'Speakers')}</button>`).join('');
$('#bRescan').innerHTML = ico('refresh') + 'Rescan';
$('#bPdf').innerHTML = ico('pdf') + 'Export PDF';
$('#bSave').innerHTML = ico('save') + 'Save Report';
$('#bRescan').onclick = rescan;
$('#bPdf').onclick = () => (window.CoreKitNative && CoreKitNative.print) ? CoreKitNative.print('CoreKit Health Report') : window.print();
if (ANDROID) $('.brand').insertAdjacentHTML('afterbegin', `<button class="back" onclick="CoreKitNative.go('home')" aria-label="Back">${ico('back')}</button>`);
$('#bSave').onclick = saveReport;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-run],[data-test]');
  if (b) RUN[b.dataset.run || b.dataset.test]();
});
document.addEventListener('contextmenu', e => e.preventDefault());
</script>

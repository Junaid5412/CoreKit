<!DOCTYPE html>
<html lang="en" style="background:#0a0e13">
<head>
<meta charset="utf-8">
<title>CoreKit Browser</title>
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
:root{--bg:#0a0e13;--side:#0c1117;--panel:#10161e;--line:#18212c;--line2:#223042;--row:#141c26;--hov:#131b25;--act:#17222e;
  --text:#c9d1d9;--white:#f0f6fc;--muted:#6b7785;--muted2:#8b98a5;--acc:#2dd4bf;--red:#f87171;--amber:#fbbf24;--sw:248px;--th:48px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,Arial,sans-serif;--fontd:"Segoe UI Variable Display","Segoe UI",system-ui,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased;user-select:none;cursor:default}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;user-select:text}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1c2633;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#2a3a4d}

#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--sw) 1fr;grid-template-rows:auto 1fr}
/* ---------- sidebar ---------- */
#side{grid-row:1/3;grid-column:1;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;position:relative;z-index:3}
#prof{height:var(--th);display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;border-bottom:1px solid var(--line);flex:none}
.pill{flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:34px;padding:0 8px 0 4px;border-radius:9px;transition:background .15s}
.pill:hover,.pill.open{background:var(--hov)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--fontd);color:#0a0e13;background:var(--pc,#2dd4bf);flex:none}
.pill .nm{flex:1;min-width:0;text-align:left;font:600 13px var(--fontd);color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .chev{color:var(--muted);width:14px;height:14px}
#newtab{margin:10px 10px 6px;height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:9px;color:var(--muted2);transition:background .15s,color .15s;flex:none}
#newtab:hover{background:var(--hov);color:var(--white)}
#newtab .k{margin-left:auto;font-size:11px;color:#4b5663}
#tabs{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 8px 10px}
.tab{position:relative;height:36px;display:flex;align-items:center;gap:10px;padding:0 6px 0 10px;border-radius:9px;margin-bottom:2px;color:var(--muted2);transition:background .12s,color .12s}
.tab:hover{background:var(--hov);color:var(--text)}
.tab.on{background:var(--act);color:var(--white)}
.tab.on::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.tab .ti{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.crash .ti{color:var(--red)}
.fav{width:16px;height:16px;flex:none;border-radius:4px;display:grid;place-items:center;position:relative}
.fav img{width:16px;height:16px;border-radius:3px}
.fav .lt{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font:700 10px var(--fontd);color:#0a0e13}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #22303f;border-top-color:var(--acc);animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.tab .x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0;flex:none;transition:opacity .12s,background .12s}
.tab:hover .x,.tab.on .x{opacity:1}
.tab .x:hover{background:#223040;color:var(--white)}
.tab .x svg{width:13px;height:13px}
.tab.drag{opacity:.4}
.tab.dropb{box-shadow:inset 0 -2px 0 var(--acc)}.tab.dropt{box-shadow:inset 0 2px 0 var(--acc)}
#foot{flex:none;border-top:1px solid var(--line);padding:8px;display:flex;align-items:center;gap:6px}
.chip{flex:1;min-width:0;height:34px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:9px;background:#0f151d;border:1px solid var(--row);transition:border-color .15s}
.chip:hover{border-color:var(--line2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#46515e;flex:none}
.chip.on .dot{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.chip.wait .dot{background:var(--amber);animation:pulse 1.2s ease-in-out infinite}
.chip.bad .dot{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.chip .tx{min-width:0;text-align:left;line-height:1.15}
.chip .tx b{display:block;font:600 12px var(--fontd);color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .tx small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted2);flex:none;transition:background .15s,color .15s}
.ib:hover{background:var(--hov);color:var(--white)}
.ib:disabled{opacity:.3;cursor:default;background:none}
/* collapsed */
.col #prof{padding:0;justify-content:center}.col .pill{flex:none;padding:0 4px}.col .pill .nm,.col .pill .chev{display:none}
.col #newtab{justify-content:center;padding:0;margin:10px 12px 6px}.col #newtab span,.col #newtab .k{display:none}
.col .tab{justify-content:center;padding:0}.col .tab .ti,.col .tab .x{display:none}
.col #foot{flex-direction:column}.col .chip{flex:none;width:34px;padding:0;justify-content:center}.col .chip .tx{display:none}

/* ---------- toolbar ---------- */
#top{grid-row:1;grid-column:2;display:flex;flex-direction:column;border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
#tb{height:calc(var(--th) - 1px);display:flex;align-items:center;gap:4px;padding:0 10px;min-width:0}
#trbar{display:none;height:42px;align-items:center;gap:10px;padding:0 10px 0 16px;border-top:1px solid var(--line);background:#0d151c;font-size:12.5px;color:var(--text);min-width:0}
#trbar.show{display:flex;animation:fade .2s ease both}
#trbar .ic2{color:var(--acc);display:grid;place-items:center}
#trbar .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trbar .tx b{color:var(--white)}
#trbar .btn{height:28px;padding:0 11px;font-size:12px;border-radius:7px;flex:none}
#trbar .x2{width:28px;height:28px}
#trbar.err .ic2{color:var(--amber)}
#trb{width:28px;height:28px;border-radius:7px;display:none;place-items:center;color:var(--muted);flex:none}
#trb.show{display:grid}#trb:hover{background:#1b2633;color:var(--white)}#trb.on{color:var(--acc)}
#trb svg{width:16px;height:16px}
#addr{flex:1;min-width:0;height:34px;display:flex;align-items:center;gap:8px;margin:0 6px;padding:0 6px 0 12px;border-radius:17px;background:#111821;border:1px solid #18222e;transition:border-color .15s,background .15s,box-shadow .15s}
#addr:hover{background:#131b25}
#addr.f{border-color:var(--acc);background:#0d1319;box-shadow:0 0 0 3px rgba(45,212,191,.12)}
#addr .si{color:var(--muted)}#addr .si.lock{color:var(--acc)}#addr .si.warn{color:var(--amber)}
#url{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--white);font-size:13.5px}
#url::placeholder{color:#55606d}
#shield{height:30px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:15px;font:600 12px var(--fontd);color:var(--muted2);background:#111821;border:1px solid #18222e;flex:none;transition:all .2s}
#shield:hover{border-color:var(--line2);color:var(--white)}
#shield.on{color:#5eead4;background:#0e2423;border-color:#14403b}
#shield.wait{color:var(--amber)}#shield.bad{color:var(--red);background:#251417;border-color:#4a2028}
#shield svg{width:14px;height:14px}

/* ---------- stage (visible only while page views are hidden) ---------- */
#stage{grid-row:2;grid-column:2;position:relative;overflow:hidden;min-width:0}
.screen{position:absolute;inset:0;display:none;place-items:center;padding:30px;
  background:radial-gradient(700px 500px at 50% 42%,rgba(45,212,191,.06),transparent 65%),var(--bg)}
.screen.show{display:grid;animation:fade .35s ease both}
@keyframes fade{from{opacity:0}}
.sbox{max-width:480px;text-align:center}
.big{width:76px;height:76px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;background:#0f2523;color:var(--acc);position:relative}
.big svg{width:36px;height:36px}
.big.bad{background:#2a1418;color:var(--red)}.big.warn{background:#2a2312;color:var(--amber)}
.big.ring::after{content:"";position:absolute;inset:-7px;border-radius:27px;border:2px solid transparent;border-top-color:var(--acc);animation:rot 1.1s linear infinite}
.sbox h2{margin:0;font:600 19px var(--fontd);color:var(--white)}
.sbox p{margin:8px 0 0;color:var(--muted2);line-height:1.55}
.sbox .btns{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{height:36px;padding:0 16px;border-radius:9px;display:inline-flex;align-items:center;gap:8px;font-weight:600;background:#151e29;border:1px solid #223042;color:var(--white);transition:all .15s}
.btn:hover{background:#1b2735;border-color:#2c3e53}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04201c}.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:#fca5a5;border-color:#4a2028;background:#1f1215}.btn.dng:hover{background:#2a1418}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:8px}
.bar{height:6px;border-radius:3px;background:#162029;overflow:hidden;margin:20px auto 0;max-width:300px;display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#14b8a6,#2dd4bf);transition:width .25s}
.small{font-size:12px;color:var(--muted);margin-top:10px}
.cks{margin:22px auto 0;text-align:left;width:440px;max-width:100%;background:#0e141b;border:1px solid #18222e;border-radius:12px;padding:6px 4px}
.ck{display:flex;align-items:center;gap:11px;padding:7px 12px;font-size:12.5px}
.ck .st{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid #2a3644}
.ck.ok .st{background:#0f3b35;border-color:#14524a;color:#5eead4}
.ck.warn .st{background:#3a2f10;border-color:#5a4714;color:#fbbf24}
.ck.fail .st{background:#3b1418;border-color:#5a1f26;color:#fca5a5}
.ck.run .st{border-color:#22303f;border-top-color:var(--acc);animation:rot .7s linear infinite}
.ck .st svg{width:11px;height:11px;stroke-width:3}
.ck .lb{flex:1;min-width:0;color:var(--white);white-space:nowrap}.ck.wait .lb{color:var(--muted)}
.ck .dt{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;text-align:right}
.ck.fail .dt{color:#fca5a5}

/* ---------- settings ---------- */
#settings{position:absolute;inset:0;overflow-y:auto;background:var(--bg);display:none;padding:28px 34px 50px}
#settings.show{display:block;animation:fade .2s ease both}
.sh{max-width:760px;margin:0 auto 18px;display:flex;align-items:center;gap:12px}
.sh h1{margin:0;flex:1;font:600 20px var(--fontd);color:var(--white)}
.card{max-width:760px;margin:0 auto 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.ch{display:flex;align-items:center;gap:12px}
.ch .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#13222a;color:var(--acc);flex:none}
.ch .ic.r{background:#24161a;color:#fca5a5}
.ch .t{flex:1;min-width:0}
.ch .t b{display:block;font:600 14.5px var(--fontd);color:var(--white)}
.ch .t small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:#1f2b3a;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#8b98a5;transition:left .22s cubic-bezier(.2,.8,.2,1),background .2s}
.sw.on{background:var(--acc)}.sw.on::after{left:21px;background:#03201c}
.plist{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.px{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:#0c1219;border:1px solid var(--row);transition:border-color .15s}
.px.sel{border-color:#1f5a52;background:#0c1a1b}
.px .rd{width:16px;height:16px;border-radius:50%;border:2px solid #3a4756;flex:none;display:grid;place-items:center}
.px.sel .rd{border-color:var(--acc)}.px.sel .rd::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
.px .nm{flex:1;min-width:0}
.px .nm b{display:block;color:var(--white);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px .nm small{color:var(--muted);font-size:11.5px}
.tag{font:700 10px var(--font);letter-spacing:.6px;padding:2px 6px;border-radius:5px;background:#172331;color:#8fb3d1;text-transform:uppercase}
.res{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.res.ok{color:#5eead4}.res.bad{color:#fca5a5}
.res i{width:7px;height:7px;border-radius:50%;background:currentColor}
.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed #223042;border-radius:10px;margin-top:14px}
.fld{margin-top:14px}
.fld label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;font-weight:700;margin-bottom:7px}
.in{width:100%;height:36px;border-radius:9px;border:1px solid #223042;background:#0c1219;color:var(--white);padding:0 12px;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(45,212,191,.12)}
textarea.in{height:78px;padding:9px 12px;resize:none;font:12px/1.45 Consolas,monospace}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.err{color:#fca5a5;font-size:12px;margin-top:8px;display:none}
.row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.seg{display:flex;background:#0c1219;border:1px solid #223042;border-radius:9px;padding:3px;gap:3px;margin-top:14px}
.seg button{flex:1;height:30px;border-radius:7px;color:var(--muted2);font-weight:500}
.seg button.sel{background:#1b2a35;color:var(--white)}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.swc{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2px #0f151d;transition:transform .15s,box-shadow .15s}
.swc.sel{box-shadow:0 0 0 2px #0f151d,0 0 0 4px #f0f6fc;transform:scale(1.08)}
.chk{display:flex;align-items:center;gap:9px;margin-top:12px;color:var(--text);cursor:pointer}
.sopts{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sopt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid #1c2733;background:#0c1219;color:var(--text);cursor:pointer;font:inherit}
.sopt:hover{border-color:#2a3c50}.sopt.on{border-color:#1f5a52;background:#0e1d1c}
.sopt i{width:18px;height:18px;border-radius:50%;border:2px solid #3a4756;flex:none;margin-top:1px;display:grid;place-items:center}
.sopt.on i{border-color:var(--acc)}.sopt.on i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
.sopt b{display:block;color:var(--white);font-weight:600;font-size:13px}.sopt small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.sopt.dng.on{border-color:#5a1f26;background:#1d0f12}.sopt.dng.on i{border-color:#f87171}.sopt.dng.on i::after{background:#f87171}
.spage{display:flex;gap:8px;margin:2px 0 0 29px}
.chk i{width:18px;height:18px;border-radius:5px;border:2px solid #3a4756;display:grid;place-items:center;flex:none}
.chk.on i{background:var(--acc);border-color:var(--acc)}
.chk.on i::after{content:"";width:5px;height:9px;border:solid #04201c;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin-top:14px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){color:var(--white)}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;margin-top:14px;font-size:12.5px;color:var(--muted2)}
.keys kbd{font:600 11px var(--font);color:var(--white);background:#172230;border:1px solid #223042;border-radius:5px;padding:1px 6px;margin-right:8px}
.applybar{display:none;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:10px;background:#0e1f1f;border:1px solid #1d4a45}
.applybar.show{display:flex}
.applybar span{flex:1;color:#a7f3d0;font-size:12.5px}

/* ---------- history ---------- */
#hist{position:absolute;inset:0;overflow-y:auto;background:var(--bg);display:none;padding:28px 34px 50px}
#hist.show{display:block;animation:fade .2s ease both}
.hsearch{max-width:760px;margin:0 auto 16px;display:flex;gap:10px}
.hsearch .in{height:38px}
.hday{max-width:760px;margin:18px auto 6px;font:700 11px var(--font);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.hlist{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.hrow{display:flex;align-items:center;gap:12px;height:42px;padding:0 8px 0 12px;border-radius:8px;cursor:pointer}
.hrow:hover{background:#151e29}
.hrow .tm{width:68px;white-space:nowrap;color:var(--muted);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.hrow .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--white)}
.hrow .hst{color:var(--muted);font-size:12px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .del{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0}
.hrow:hover .del{opacity:1}.hrow .del:hover{background:#2a1418;color:#fca5a5}
.hnote{max-width:760px;margin:0 auto 10px;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chipx{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 11px;border-radius:14px;background:#152230;border:1px solid #223042;font-size:12px;color:var(--white)}
.chipx button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}.chipx button:hover{background:#2a1418;color:#fca5a5}
.chipx svg{width:11px;height:11px}
select.in{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#6b7785 50%),linear-gradient(135deg,#6b7785 50%,transparent 50%);background-position:calc(100% - 18px) 16px,calc(100% - 13px) 16px;background-size:5px 5px;background-repeat:no-repeat}
select.in option{background:#10161e}
.trow{display:flex;align-items:center;gap:12px;margin-top:14px}
.trow span{flex:1;color:var(--text)}

/* ---------- profile menu ---------- */
#pmenu{position:absolute;left:8px;top:calc(var(--th) - 4px);width:232px;background:#111821;border:1px solid #213040;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:6px;display:none;z-index:20}
#pmenu.show{display:block;animation:pop .14s ease both}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.mh{padding:8px 10px 6px;font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.mi{width:100%;display:flex;align-items:center;gap:10px;height:38px;padding:0 8px;border-radius:8px;text-align:left}
.mi:hover{background:#18222e}
.mi .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--white)}
.mi small{color:var(--muted);font-size:11px}
.mi .del{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0}
.mi:hover .del{opacity:1}.mi .del:hover{background:#2a1418;color:#fca5a5}
.mi .del.ask{opacity:1;background:#2a1418;color:#fca5a5;width:auto;padding:0 8px;font-size:11px;font-weight:700}
.sep{height:1px;background:#1c2733;margin:6px 4px}
.np{padding:6px 8px 8px}
.np .in{height:32px;font-size:12.5px}
.np .sws{margin:10px 0;gap:8px}.np .swc{width:20px;height:20px}
#veil{position:fixed;inset:0;z-index:2;display:none}#veil.show{display:block}
html.ovl,html.ovl body{background:transparent!important}html.ovl #veil{background:rgba(0,0,0,.28);top:var(--th)}

#altBtn.on{color:var(--acc);background:#10262a}
#tabsBtn,#menuBtn,#sideClose{display:none}
#tabsBtn{width:38px;height:38px;place-items:center;flex:none;border-radius:9px}
#tabsBtn span{min-width:22px;height:22px;padding:0 4px;border:2px solid var(--muted2);border-radius:6px;display:grid;place-items:center;font:700 11.5px var(--fontd);color:var(--white)}
#kmenu{position:fixed;right:8px;top:calc(var(--th) + 4px);width:250px;background:#111821;border:1px solid #213040;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6);padding:6px;display:none;z-index:20}
#kmenu.show{display:block;animation:pop .14s ease both}
#kmenu .mi{height:44px;font-size:14px}
#kmenu .mi svg{width:18px;height:18px;color:var(--muted2)}
#kmenu .mi .tick{margin-left:auto;width:18px;height:18px;border-radius:5px;border:2px solid #3a4756;display:grid;place-items:center}
#kmenu .mi .tick.on{background:var(--acc);border-color:var(--acc)}
#kmenu .mi .tick.on::after{content:"";width:5px;height:9px;border:solid #04201c;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
#kmenu .row3{display:flex;gap:4px;padding:2px 2px 6px;border-bottom:1px solid #1c2733;margin-bottom:4px}
#kmenu .row3 .ib{flex:1;height:42px}
/* ---------- phones: Chrome-style top bar, tab switcher and ⋮ menu ---------- */
@media (max-width:600px){
  :root{--th:54px}
  #app{grid-template-columns:0 1fr}
  #side{display:none}
  #side.open{display:flex;position:fixed;inset:0;width:100%;z-index:12}
  #side.open #prof{padding:0 8px}
  #sideClose{display:grid}
  #colbtn,#altBtn,#bBack,#bFwd,#bRel,#bHome,#newtab .k{display:none!important}
  #tabsBtn{display:grid}#menuBtn{display:grid}
  #tb{padding:0 4px 0 8px;gap:2px}
  #shield{order:-1}
  #addr{margin:0 2px 0 4px;padding:0 4px 0 12px;height:40px;border-radius:20px}
  .tab{height:48px;font-size:14px}
  #tabs{padding:6px 10px 10px}
  #url{font-size:14px}
  #shield{padding:0;width:34px;height:34px;justify-content:center;border-radius:50%}#shield span{display:none}
  #trbar{height:auto;min-height:42px;flex-wrap:wrap;padding:6px 8px 6px 12px;gap:6px}
  #trbar .tx{flex-basis:calc(100% - 40px);white-space:normal}
  #trbar [data-tr=never]{display:none}
  #settings,#hist{padding:16px 12px 40px}
  .card{padding:16px 14px}
  .px{flex-wrap:wrap}
  .kv{grid-template-columns:120px 1fr}
  .keys{grid-template-columns:1fr}
  .sh h1{font-size:18px}
  .screen{overflow-y:auto;place-items:start center;grid-template-columns:100%;padding:22px 14px 30px}
  .sbox{max-width:100%;width:100%;min-width:0}
  .sbox .big{margin-top:6px}
  .cks{width:100%;padding:4px 2px}
  .ck{flex-wrap:wrap;column-gap:10px;row-gap:1px;padding:7px 10px;font-size:13px}
  .ck .lb{flex:1 1 0;white-space:normal}
  .ck .dt{flex-basis:100%;max-width:none;text-align:left;white-space:normal;padding-left:29px;font-size:11.5px}
  .ck .dt:empty{display:none}
  .sbox .btns .btn{flex:1 1 auto;justify-content:center}
  #pmenu{position:fixed;left:8px;top:calc(var(--th) + env(safe-area-inset-top))}
}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#16212d;border:1px solid #243446;color:var(--white);padding:9px 16px;border-radius:10px;font-size:12.5px;transition:all .25s;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{border-color:#5a2a31;color:#fecaca}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="prof"><button class="ib" id="sideClose" title="Back to page"><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><button class="pill" id="pbtn" title="Profiles"><span class="av" id="pav">P</span><span class="nm" id="pname">Profile</span><svg class="i chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></div>
    <button id="newtab" title="New tab (Ctrl+T)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New tab</span><span class="k">Ctrl+T</span></button>

      <button class="ib" id="histbtn" title="History (Ctrl+H)"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>

<script>
"use strict";
const W = window.chrome && window.chrome.webview;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const send = o => { try { W && W.postMessage(o); } catch (e) {} };
const IC = {
  home:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  warn:'<path d="M12 3 2 21h20z"/><path d="M12 10v4M12 17.5v.5"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  shok:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  shx:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9.5 9.5 5 5M14.5 9.5l-5 5"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  stop:'<path d="M6 6l12 12M18 6 6 18"/>',
  reload:'<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  search2:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/>',
  broom:'<path d="M19 3 11 11"/><path d="M8.5 10.5 4 15c-1 1-1 3 1 5s4 2 5 1l4.5-4.5"/><path d="m8 11 5 5"/>',
  fwd:'<path d="M5 12h14M12 5l7 7-7 7"/>', clock:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  lang:'<path d="M4 5h9M8.5 3v2M6 5c.5 3 2.5 6 5.5 7.5M11 5c-.8 3.5-3 6.5-6.5 8"/><path d="m12 21 4.5-10L21 21M13.5 18h6"/>',
  monitor:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>', phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  tabsI:'<rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
  block:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/>', back:'<path d="M19 12H5M12 19l-7-7 7-7"/>'
};
const svg = (n, cls) => `<svg class="i ${cls||""}" viewBox="0 0 24 24">${IC[n]}</svg>`;

let S = {profile:{name:"Profile",color:"#2dd4bf",search:"google",bypass:""},profiles:[],proxies:[],engines:[],colors:[],proxyOn:false,proxyChosen:"",proxyActive:""};
let T = {tabs:[],active:0};
let ST = {state:"",msg:""};
let collapsed = false, settingsOpen = false, menuOpen = false, editing = false, histOpen = false;

/* ---------- layout ---------- */
function layout() {
  const sw = PHONE ? 0 : $("#side").getBoundingClientRect().width, th = $("#top").getBoundingClientRect().height;
  send({t:"layout", sw, th});
}
const PHONE = matchMedia("(max-width:600px)").matches;
function setCollapsed(v, tell) {
  if (PHONE) { // the rail stays 56px; expanding opens a drawer over the page
    collapsed = v;
    $("#app").classList.toggle("col", v);
    $("#side").classList.toggle("open", !v);
    $("#colarr").setAttribute("d", v ? "m13 10 2 2-2 2" : "m15 10-2 2 2 2");
    layout(); cover();
    return;
  }
  collapsed = v;
  document.documentElement.style.setProperty("--sw", v ? "60px" : "248px");
  $("#app").classList.toggle("col", v);
  $("#colarr").setAttribute("d", v ? "m13 10 2 2-2 2" : "m15 10-2 2 2 2");
  $("#colbtn").title = v ? "Expand sidebar" : "Collapse sidebar";
  layout();
  if (tell) send({t:"collapsed", on:v});
}
const ro = new ResizeObserver(layout); ro.observe(document.body); ro.observe(document.getElementById("top"));
// Pages are native views beside this screen. Full panels (settings, history, tab list) hide the page;
// small menus ("light") are drawn over it with this screen made see-through, so the page stays visible.
function cover() {
  const full = settingsOpen || histOpen || (PHONE && !collapsed), light = !full && (kOpen || (menuOpen && collapsed));
  document.documentElement.classList.toggle("ovl", light);
  send({t:"cover", on: full || light, light});
}
let kOpen = false;
function setK(v) {
  kOpen = v;
  if (v) {
    const tr = T.tr || {}, ok = (k, l, ic, extra = "") => `<button class="mi" data-k="${k}">${svg(ic)}<span class="nm">${l}</span>${extra}</button>`;
    $("#kmenu").innerHTML = `<div class="row3"><button class="ib" data-k="back" ${T.canBack ? "" : "disabled"} title="Back">${svg("back")}</button><button class="ib" data-k="fwd" ${T.canFwd ? "" : "disabled"} title="Forward">${svg("fwd")}</button><button class="ib" data-k="${T.loading ? "stop" : "reload"}" title="Reload">${svg(T.loading ? "stop" : "reload")}</button><button class="ib" data-k="home" title="Home page">${svg("home")}</button></div>` +
      (S.platform === "android" ? ok("mainMenu", "CoreKit main menu", "grid") + `<div class="sep"></div>` : "") +
      ok("newtab", "New tab", "plus") + ok("tabs", `Tabs (${T.tabs.length})`, "tabsI") + ok("history", "History", "clock") +
      (tr.page ? ok("translate", (tr.state === "done" || tr.state === "doneHidden") ? "Show original" : "Translate page", "lang") : "") +
      ok("alt", PHONE ? "Desktop site" : "Mobile view", PHONE ? "monitor" : "phone", `<span class="tick${T.alt ? " on" : ""}"></span>`) +
      `<div class="sep"></div>` + ok("proxy", "Proxy / VPN", "shield") + ok("settings", "Settings", "gear") + ok("profiles", "Profiles", "user") +
      (PHONE && S.platform !== "android" ? `<div class="sep"></div>` + ok("exit", "Close browser", "x") : "");
  }
  $("#kmenu").classList.toggle("show", v); $("#veil").classList.toggle("show", v || menuOpen); cover();
}
$("#menuBtn").onclick = () => setK(!kOpen);
$("#tabsBtn").onclick = () => setCollapsed(false, false);
$("#sideClose").onclick = () => setCollapsed(true, false);
$("#altBtn").onclick = () => send({t:"siteMode", on: !T.alt});
// on start / on close (also asked when a profile is created)
const START_OPTS = [["restore", "Continue where you left off", "Reopens your tabs. Logins and history are kept."],
  ["newtab", "Open a new tab", "Starts fresh. Logins and history are kept."],
  ["page", "Open a specific page", "Starts with a page you choose. Logins and history are kept."],
  ["clear", "Clear everything when closed", "Signs you out and erases cookies, history, cache and tabs each time."]];
let stPick = "";
$("#kmenu").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b || b.disabled) return;
  const k = b.dataset.k; setK(false);
  if (["back", "fwd", "reload", "stop", "newtab", "home", "mainMenu"].includes(k)) send({t:k});
  else if (k === "tabs") setCollapsed(false, false);
  else if (k === "history") openHistory();
  else if (k === "translate") { const st = (T.tr || {}).state; send({t:"tr", id: st === "done" || st === "doneHidden" ? "original" : "translate"}); }
  else if (k === "alt") send({t:"siteMode", on: !T.alt});
  else if (k === "proxy") openSettings("proxy");
  else if (k === "settings") openSettings();
  else if (k === "profiles") { if (PHONE) setCollapsed(false, false); setMenu(true); }
  else if (k === "exit") send({t:"exit"});
});

/* ---------- tabs ---------- */
function hostOf(u) { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.host : ""; } catch (e) { return ""; } }
function colorFor(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360} 55% 62%)`; }
const favOK = {};
function favHTML(t) {
  if (t.loading) return '<span class="fav"><i class="spin"></i></span>';
  if (!t.url) return `<span class="fav" style="color:var(--acc)">${svg("search")}</span>`;
  const h = hostOf(t.url);
  const lt = `<span class="lt" style="background:${colorFor(h || t.url)}">${esc((h.replace(/^www\./, "")[0] || "•").toUpperCase())}</span>`;
  if (!h || favOK[h] === false) return `<span class="fav">${lt}</span>`;
  const img = `<img src="https://${esc(h)}/favicon.ico" data-h="${esc(h)}" alt="" onload="favLoad(this)" onerror="favErr(this)"${favOK[h] ? "" : ' style="position:absolute;inset:0;opacity:0"'}>`;
  return `<span class="fav">${favOK[h] ? "" : lt}${img}</span>`;
}
window.favErr = img => { favOK[img.dataset.h] = false; img.remove(); };
window.favLoad = img => {
  if (img.naturalWidth < 8) return favErr(img);
  favOK[img.dataset.h] = true; img.style.opacity = 1; img.style.position = "static";
  const l = img.previousElementSibling; if (l) l.remove();
};

let dragId = 0;
function renderTabs() {
  const box = $("#tabs");
  box.innerHTML = T.tabs.map(t => `<div class="tab${t.id === T.active ? " on" : ""}${t.crashed ? " crash" : ""}" data-id="${t.id}" draggable="true" title="${esc(t.title)}${t.url ? "\n" + esc(t.url) : ""}">${favHTML(t)}<span class="ti">${esc(t.title || "New tab")}</span><button class="x" data-x="${t.id}" title="Close (Ctrl+W)">${svg("x")}</button></div>`).join("");
  const on = box.querySelector(".tab.on");
  if (on) { const r = on.getBoundingClientRect(), b = box.getBoundingClientRect(); if (r.top < b.top || r.bottom > b.bottom) on.scrollIntoView({block:"nearest"}); }
}
$("#tabs").addEventListener("mousedown", e => {
  const x = e.target.closest("[data-x]"); const tab = e.target.closest(".tab");
  if (e.button === 1 && tab) { e.preventDefault(); send({t:"close", tab:+tab.dataset.id}); return; }
  if (e.button !== 0 || x || !tab) return;
  send({t:"activate", tab:+tab.dataset.id});
});
$("#tabs").addEventListener("click", e => { const x = e.target.closest("[data-x]"); if (x) send({t:"close", tab:+x.dataset.x}); });
$("#tabs").addEventListener("dblclick", e => { if (!e.target.closest(".tab")) send({t:"newtab"}); });
$("#tabs").addEventListener("dragstart", e => { const t = e.target.closest(".tab"); if (!t) return; dragId = +t.dataset.id; t.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; });
$("#tabs").addEventListener("dragend", () => { dragId = 0; renderTabs(); });
$("#tabs").addEventListener("dragover", e => {
  if (!dragId) return; e.preventDefault();
  document.querySelectorAll(".dropt,.dropb").forEach(n => n.classList.remove("dropt", "dropb"));
  const t = e.target.closest(".tab"); if (!t) return;
  const r = t.getBoundingClientRect(); t.classList.add(e.clientY < r.top + r.height / 2 ? "dropt" : "dropb");
});
$("#tabs").addEventListener("drop", e => {

  <div class="card" id="sec-profile">

    <div class="fld"><label>Name</label><input class="in" id="prName" maxlength="32" value="${esc(pName)}"></div>
    <div class="fld"><label>Color</label><div class="sws">${cols.map(c => `<button class="swc${c === pColor ? " sel" : ""}" data-pc="${c}" style="background:${c}"></button>`).join("")}</div></div>
    <div class="row"><button class="btn pri" data-s="psave">Save profile</button></div>
  </div>

  <div class="card" id="sec-about">
    <div class="ch"><span class="ic">${svg("info")}</span><span class="t"><b>About</b><small>CoreKit Browser</small></span></div>
    <div class="kv"><span>Version</span><span>CoreKit ${esc(S.version || "")}</span><span>Web engine</span><span>Microsoft WebView2 ${esc(S.webview || "")}</span><span>Proxy engine</span><span>${S.xray ? esc(S.xray) : "Not installed (downloads when first needed)"}</span></div>
    <div class="keys"><span><kbd>Ctrl T</kbd>New tab</span><span><kbd>Ctrl W</kbd>Close tab</span><span><kbd>Ctrl Shift T</kbd>Reopen closed tab</span><span><kbd>Ctrl L</kbd>Address bar</span><span><kbd>Ctrl Tab</kbd>Next tab</span><span><kbd>Ctrl 1–9</kbd>Go to tab</span><span><kbd>Alt ←/→</kbd>Back / forward</span><span><kbd>Ctrl F</kbd>Find in page</span></div>
  </div>`;
}
const setEl = $("#settings");
setEl.addEventListener("change", e => { if (e.target.id === "langSel") { S.lang = e.target.value; send({t:"lang", id:S.lang}); toast("Language: " + langLabel()); renderSettings(); } });
function langLabel() { return ((S.langs || []).find(l => l.Code === S.lang) || {Name:"English"}).Name; }
setEl.addEventListener("input", e => {
  if (e.target.id === "byp") { D.bypass = e.target.value; $("#apply").classList.toggle("show", dirty()); }
  if (e.target.id === "prName") pName = e.target.value;
});
setEl.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "stPage") setEl.querySelector('[data-start="pageSave"]')?.click(); });
setEl.addEventListener("click", e => {
  const g = (sel) => e.target.closest(sel);
  let x;
  if ((x = g("[data-start]"))) {
    const k = x.dataset.start;
    if (k === "page") { stPick = "page"; renderSettings(); $("#stPage")?.focus(); return; }
    if (k === "pageSave") { const u = ($("#stPage")?.value || "").trim(); if (!u) { $("#stPage")?.focus(); return; } stPick = ""; S.startup = "page"; S.startPage = u; S.noTrace = false; send({t:"startup", id:"page", url:u}); renderSettings(); toast("This page opens at start"); return; }
    stPick = ""; S.startup = k; S.noTrace = k === "clear"; send({t:"startup", id:k}); renderSettings();
    toast({restore:"Your tabs will reopen next time", newtab:"A new tab opens next time", clear:"Everything is erased when the browser closes"}[k]); return;
  }
  if ((x = g("[data-test]"))) { testing[x.dataset.test] = true; send({t:"proxyTest", id:x.dataset.test}); renderSettings(); return; }
  if ((x = g("[data-pdel]"))) { if (x.dataset.ask) { send({t:"proxyDel", id:x.dataset.pdel}); } else { x.dataset.ask = 1; x.innerHTML = "<b style='font-size:10px;color:#fca5a5'>DEL?</b>"; } return; }
  if ((x = g("[data-pick]"))) { D.id = x.dataset.pick; D.on = true; renderSettings(); return; }
  if ((x = g("[data-eng]"))) { S.profile.search = x.dataset.eng; send({t:"search", engine:x.dataset.eng}); renderSettings(); toast("Search engine updated"); return; }
  if ((x = g("[data-opt]"))) { const on = !x.classList.contains("on"); x.classList.toggle("on", on); S[x.dataset.opt] = on; send({t:x.dataset.opt, on}); toast(S.platform === "windows" ? "Restarting to apply…" : "Applied"); return; }
  if ((x = g("[data-topt]"))) { const on = !x.classList.contains("on"); x.classList.toggle("on", on); S[{offer:"transOffer", auto:"transAuto", google:"googleFix"}[x.dataset.topt]] = on; send({t:"transOpt", id:x.dataset.topt, on}); return; }
  if ((x = g("[data-lrm]"))) { send({t:"langList", id:x.dataset.lrm}); return; }
  if ((x = g("[data-priv]"))) { const on = !x.classList.contains("on"); x.classList.toggle("on", on); S.shield = on; send({t:"privacy", id:x.dataset.priv, on}); toast(on ? "Hidden from screen capture" : "Screen capture allowed"); return; }
  if ((x = g("[data-pc]"))) { pColor = x.dataset.pc; renderSettings(); return; }
  if (!(x = g("[data-s]"))) return;
  const k = x.dataset.s;
  if (k === "close") closeSettings();
  else if (k === "toggle") { D.on = !D.on; if (D.on && !D.id && S.proxies[0]) D.id = S.proxies[0].id; if (D.on && !S.proxies.length) { D.on = false; addOpen = true; toast("Add a proxy first", true); } renderSettings(); }
  else if (k === "addopen") { addOpen = true; renderSettings(); $("#pLink").focus(); }
  else if (k === "addcancel") { addOpen = false; renderSettings(); }
  else if (k === "add") {
    const link = $("#pLink").value.trim(), name = $("#pName").value.trim();
    if (!link) { $("#pLink").focus(); return; }
    x.disabled = true; send({t:"proxyAdd", link, name});
  }
  else if (k === "revert") { D = draftFromState(); renderSettings(); }
  else if (k === "apply") { x.disabled = true; x.textContent = "Restarting…"; send({t:"proxyApply", on:D.on, id:D.id, bypass:D.bypass}); }
  else if (k === "install") { inst = {pct:1, msg:"Starting download…", busy:true}; send({t:"install"}); renderSettings(); }
  else if (k === "keeppw") { keepPw = !keepPw; renderSettings(); }
  else if (k === "reset") { if (!resetAsk) { resetAsk = true; renderSettings(); setTimeout(() => { if (resetAsk) { resetAsk = false; renderSettings(); } }, 5000); } else { x.disabled = true; x.textContent = "Resetting…"; send({t:"reset", keepPw}); } }
  else if (k === "resetno") { resetAsk = false; renderSettings(); }
  else if (k === "psave") { const n = ($("#prName").value || "").trim(); if (!n) { $("#prName").focus(); return; } send({t:"profileSave", name:n, color:pColor}); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (kOpen) setK(false); else if (PHONE && !collapsed) setCollapsed(true, false); else if (menuOpen) setMenu(false); else if (settingsOpen) closeSettings(); else if (histOpen) closeHistory(); }
});

/* ---------- history ---------- */
let H = {items:[], persist:true}, hq = "", hTimer = 0, clearAsk = false;
function openHistory() {
  if (menuOpen) setMenu(false); if (settingsOpen) closeSettings();
  histOpen = true; clearAsk = false; $("#hist").classList.add("show"); renderHist(); cover();
  send({t:"history", name:hq}); const i = $("#hq"); if (i) i.focus();
}
function closeHistory() { histOpen = false; $("#hist").classList.remove("show"); cover(); }
function dayLabel(d) {
  const t = new Date(); t.setHours(0,0,0,0); const x = new Date(d); x.setHours(0,0,0,0);
  const diff = Math.round((t - x) / 864e5);
  if (diff === 0) return "Today"; if (diff === 1) return "Yesterday";
  return x.toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"long", year: x.getFullYear() === t.getFullYear() ? undefined : "numeric"});
}
function renderHist() {
  const el = $("#hist"), focusQ = document.activeElement && document.activeElement.id === "hq";
  let groups = [], last = "";
  for (const it of H.items) { const lb = dayLabel(it.at * 1000); if (lb !== last) { groups.push({lb, items:[]}); last = lb; } groups[groups.length - 1].items.push(it); }
  const row = it => { const h = hostOf(it.u), hs = h.replace(/^www\./, ""); return `<div class="hrow" data-u="${esc(it.u)}" data-at="${it.at}" title="${esc(it.u)}"><span class="tm">${new Date(it.at * 1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})}</span><span class="fav"><span class="lt" style="background:${colorFor(h || it.u)}">${esc((hs[0] || "•").toUpperCase())}</span></span><span class="ttl">${esc(it.t || it.u)}</span><span class="hst">${esc(hs)}</span><button class="del" data-hdel="1" title="Remove">${svg("x")}</button></div>`; };
  el.innerHTML = `<div class="sh"><button class="ib" data-h="close" title="Back to browsing">${svg("back")}</button><h1>History</h1><button class="btn dng sm" data-h="clear">${clearAsk ? "Click again to clear everything" : "Clear history"}</button></div>
    <div class="hsearch"><input class="in" id="hq" placeholder="Search history" value="${esc(hq)}" spellcheck="false"></div>
    ${H.persist ? "" : '<div class="hnote">"Clear everything when closed" is on: this history is erased when the browser closes.</div>'}
    ${groups.length ? groups.map(g => `<div class="hday">${esc(g.lb)}</div><div class="hlist">${g.items.map(row).join("")}</div>`).join("")
      : `<div class="empty" style="max-width:760px;margin:30px auto">${hq ? "No matches" : "No history yet"}</div>`}`;
  if (focusQ) { const i = $("#hq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
$("#hist").addEventListener("input", e => { if (e.target.id !== "hq") return; hq = e.target.value; clearTimeout(hTimer); hTimer = setTimeout(() => send({t:"history", name:hq}), 150); });
$("#hist").addEventListener("mousedown", e => { const r = e.target.closest(".hrow"); if (r && e.button === 1 && !e.target.closest("[data-hdel]")) { e.preventDefault(); send({t:"nav", url:r.dataset.u, on:true}); } });
$("#hist").addEventListener("click", e => {
  const b = e.target.closest("[data-h]");
  if (b) {
    if (b.dataset.h === "close") closeHistory();
    else if (!clearAsk) { clearAsk = true; renderHist(); setTimeout(() => { if (clearAsk) { clearAsk = false; if (histOpen) renderHist(); } }, 5000); }
    else { clearAsk = false; send({t:"histClear"}); toast("History cleared"); }
    return;
  }
  const r = e.target.closest(".hrow"); if (!r) return;
  if (e.target.closest("[data-hdel]")) { send({t:"histDel", url:r.dataset.u, to:+r.dataset.at, name:hq}); r.remove(); return; }
  send({t:"nav", url:r.dataset.u, on: e.ctrlKey}); closeHistory();
});

/* ---------- messages from CoreKit ---------- */
let tt = 0;
function toast(m, bad) { const t = $("#toast"); t.textContent = m; t.className = "show" + (bad ? " bad" : ""); clearTimeout(tt); tt = setTimeout(() => t.className = bad ? "bad" : "", 2600); }
function applyState(m) {
  S = Object.assign(S, m);
  const p = S.profile;
  $("#pav").textContent = (p.name || "P")[0].toUpperCase(); $("#pav").style.setProperty("--pc", p.color);
  $("#pname").textContent = p.name;
  const e = (S.engines.find(x => x.id === p.search) || {name:"Google"}).name;
  url.placeholder = `Search with ${e} or enter address`;
  if (!PHONE && m.collapsed !== undefined && m.collapsed !== collapsed) setCollapsed(m.collapsed, false);
  if (menuOpen) renderMenu();
  if (settingsOpen) { const keep = D; D = keep || draftFromState(); renderSettings(); }
}
function onMsg(m) {
  if (!m || typeof m !== "object") return;
  switch (m.t) {
    case "state": applyState(m); break;
    case "tabs": T = m; renderTabs(); renderBar(); $("#tabsN").textContent = T.tabs.length > 99 ? ":D" : T.tabs.length; $("#altBtn").classList.toggle("on", !!T.alt); $("#altBtn").title = T.alt ? "Back to desktop view" : "Mobile view"; break;
    case "status": ST = m; renderStatus(); if (settingsOpen) renderSettings(); break;
    case "focusAddress": if (!settingsOpen && !histOpen) { url.focus(); url.select(); } break;
    case "openHistory": openHistory(); break;
    case "history": H = {items:m.items || [], persist:m.persist}; if (histOpen) renderHist(); break;
    case "toast": toast(m.msg, m.bad); break;
    case "install":
      if (m.pct < 0) { inst = {pct:0, msg:"Install failed: " + m.msg, busy:false}; toast("Install failed", true); }
      else inst = {pct:m.pct, msg:m.msg, busy:m.pct < 100};
      if (ST.state === "engine") { const b = $("#ibar"); if (b && inst.busy) { b.style.display = "block"; b.firstElementChild.style.width = inst.pct + "%"; $("#imsg").textContent = inst.msg; } else renderScreen(); }
      if (settingsOpen) renderSettings();
      break;
    case "proxyAdded":
      if (m.error) { const er = $("#pErr"); if (er) { er.textContent = m.error; er.style.display = "block"; } const b = setEl.querySelector('[data-s="add"]'); if (b) b.disabled = false; }
      else { addOpen = false; testing[m.id] = true; if (!D.on || !D.id) { D.on = true; D.id = m.id; } renderSettings(); toast("Proxy added — testing…"); }
      break;
    case "proxyTesting": testing[m.id] = true; renderSettings(); break;
    case "proxyTested":
      delete testing[m.id];
      if (m.needEngine) { needEng = true; toast("The proxy engine is needed to test proxies", true); }
      else { const p = S.proxies.find(x => x.id === m.id); if (p) p.test = m.test; toast(m.test && m.test.ok ? `Working · ${m.test.ms} ms${m.test.country ? " · " + m.test.country : ""}` : "Test failed: " + ((m.test && m.test.error) || "no connection"), !(m.test && m.test.ok)); }
      renderSettings(); break;
  }
}
if (W) W.addEventListener("message", e => onMsg(e.data));
window.__corekit = onMsg; // test hook
setCollapsed(PHONE, false);
if (PHONE) { // tapping a tab or "New tab" in the open drawer closes it
  $("#tabs").addEventListener("click", e => { if (!collapsed && e.target.closest(".tab") && !e.target.closest("[data-x]")) setCollapsed(true, false); });
  $("#newtab").addEventListener("click", () => { if (!collapsed) setCollapsed(true, false); });
}
renderBar(); renderStatus();
send({t:"ready"});
</script>
</body>
</html>

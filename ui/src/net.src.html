<!DOCTYPE html>
<html lang="en" style="background:#0a0e13">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreKit · Internet Troubleshooter</title>
<meta name="theme-color" content="#0a0e13">
<meta name="color-scheme" content="dark">
<link id="fav" rel="icon" href="data:,">
<style id="css">
/*BASE_CSS*/
/* ---------------- internet troubleshooter ---------------- */
.home-wrap{display:flex;flex-direction:column;align-items:center;gap:38px;margin-top:-20px}
.start svg.wf{width:56px;height:56px}
.site-in{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-start;width:540px;max-width:90vw;min-height:46px;padding:6px 8px 6px 16px;border-radius:24px;background:#0e151d;border:1px solid var(--line2);transition:border-color .2s,box-shadow .2s,opacity .4s;animation:enter 1.1s .15s cubic-bezier(.2,.8,.2,1) both}
.site-in:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(45,212,191,.12)}
.site-in>svg{color:var(--muted)}
.site-in input{flex:1;min-width:200px;background:transparent;border:0;outline:0;color:var(--white);font:14px var(--font);padding:6px 4px}
.site-in input::placeholder{color:#5b6672}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 11px;border-radius:999px;background:#122627;color:#99f6e4;font-size:12.5px;border:1px solid rgba(45,212,191,.35)}
.chip b{cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#5eead4;font-weight:400;font-size:15px;line-height:1}
.chip b:hover{background:rgba(45,212,191,.2)}
body.scanning .site-in,body.done .site-in{opacity:0;pointer-events:none}

.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;border:1px solid;margin-bottom:16px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.banner .bi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.banner .bt{color:var(--white);font-weight:600}
.banner .bd{color:var(--muted2);font-size:12.5px;margin-top:2px}

.path{display:flex;align-items:flex-start;padding:10px 4px 2px}
.node{display:flex;flex-direction:column;align-items:center;gap:9px;width:118px;flex:none;text-align:center}
.nd-ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c);color:var(--c);background:var(--bgc);box-shadow:0 0 26px var(--glow);transition:all .3s}
.nd-ic svg{width:25px;height:25px}
.node .nm{font-weight:600;color:var(--white);font-size:13px}
.node .st{font-size:12px;color:var(--c);margin-top:-5px;font-variant-numeric:tabular-nums}
@media (max-width:600px){.card table{display:block;overflow-x:auto}.path{padding:6px 0 0}.node{width:56px;gap:6px}.nd-ic{width:40px;height:40px}.nd-ic svg{width:18px;height:18px}.node .nm{font-size:10.5px}.node .st{font-size:10px;margin-top:-3px}.link{margin-top:20px}}
.link{flex:1;height:2px;margin-top:30px;background:var(--lc);position:relative;overflow:hidden;border-radius:1px}
.link.flow::after{content:"";position:absolute;top:0;left:-35%;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:flow 1.9s linear infinite}
@keyframes flow{to{left:100%}}
.static .link.flow::after{animation:none;display:none}

.speed{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigv{padding:14px 16px;border-radius:10px;background:#0c1219;border:1px solid var(--row)}
.bigv .l{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.3px;font-weight:700}
.bigv .l svg{width:14px;height:14px}
.bigv .v{font:600 36px/1.05 var(--fontd);color:var(--white);font-variant-numeric:tabular-nums;margin-top:6px}
.bigv .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.mini{padding:10px 12px;border-radius:10px;background:#0c1219;border:1px solid var(--row)}
.mini .v{font:600 18px var(--fontd);color:var(--white);font-variant-numeric:tabular-nums}
.mini .v small{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:3px}
.mini .l{font-size:11px;color:var(--muted);margin-top:1px}
.pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}
.empty{padding:26px 0;text-align:center;color:var(--muted)}

.iss{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--row)}
.iss:first-of-type{border-top:0;padding-top:2px}
.iss .t{color:var(--white);font-weight:600;font-size:13px}
.iss .d{color:var(--muted2);font-size:12.5px;margin-top:2px}
.btn.sm{height:28px;padding:0 11px;font-size:12px;border-radius:7px;gap:6px}
.btn.sm svg.i{width:13px;height:13px}

.dnsr{display:grid;grid-template-columns:118px 128px 1fr 64px 96px;gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--row);font-size:13px}
.dnsr:first-of-type{border-top:0}
.dnsr .n{color:var(--white);font-weight:600}
.dnsr .ip{color:var(--muted);font-variant-numeric:tabular-nums}
.dnsr .ms{text-align:right;color:var(--white);font-weight:600;font-variant-numeric:tabular-nums}
.dnsr .a{text-align:right}
.dnsr .a .btn{white-space:nowrap}
@media (max-width:600px){
  .dnsr{grid-template-columns:1fr auto;grid-template-areas:"name act" "ip ms" "bar bar";column-gap:10px;row-gap:3px;padding:11px 0;font-size:12.5px}
  .dnsr .n{grid-area:name;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .dnsr .ip{grid-area:ip;font-size:12px;align-self:center}
  .dnsr .ms{grid-area:ms;align-self:center}
  .dnsr .a{grid-area:act;align-self:center}
  .dnsr .track{grid-area:bar;margin-top:2px}
}

.site{border-top:1px solid var(--row);padding:10px 0}
.site:first-of-type{border-top:0;padding-top:2px}
.srow2{display:grid;grid-template-columns:1.5fr .7fr .7fr .8fr 1.6fr .9fr;gap:12px;align-items:center;font-size:12.5px}
.srow2.hd{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.1px;font-weight:700;padding-bottom:6px}
.srow2 .h{color:var(--white);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;min-width:0}
.srow2 .h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow2 .m{color:var(--text);font-variant-numeric:tabular-nums}
.srow2 .x{color:#ef4444}
.tagc{font-size:9.5px;font-weight:700;letter-spacing:.8px;color:var(--acc);border:1px solid rgba(45,212,191,.4);border-radius:4px;padding:1px 5px;flex:none}
.cause{margin:8px 0 0 15px;padding:9px 12px;border-radius:8px;font-size:12.5px;display:flex;gap:12px;align-items:center;justify-content:space-between}
@media (max-width:640px){
  .srow2.hd{display:none}
  .srow2{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
  .srow2 .h{grid-column:1/-1;font-size:14px}
  .srow2 .h span{white-space:normal;overflow-wrap:anywhere}
  .srow2 .m{display:block;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid var(--row);font-size:13px;min-width:0;overflow-wrap:anywhere}
  .srow2 .m::before{content:attr(data-l);display:block;margin-bottom:2px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .srow2 .m.cert{grid-column:span 2;order:1}
  .site{padding:14px 0}
  .cause{margin-left:0;flex-wrap:wrap}
  .ct:has(.addsite){flex-wrap:wrap;gap:10px}
  .addsite{width:100%}
  .addsite input{flex:1;width:auto;min-width:0;height:36px;font-size:14px}
  .addsite .btn{height:36px}
  .card table.kv{display:table;width:100%;overflow:visible}
  table.kv td.v{overflow-wrap:anywhere}
}
.addsite{display:flex;gap:8px;align-items:center}
.addsite input{height:28px;width:200px;border-radius:7px;border:1px solid #223042;background:#0c1219;color:var(--white);padding:0 10px;font:12.5px var(--font);outline:none}
.addsite input:focus{border-color:var(--acc)}

.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.tool{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;background:#0c1219;border:1px solid var(--row);cursor:pointer;transition:border-color .2s,background .2s,transform .1s;text-align:left;color:inherit;font:inherit}
.tool:hover{border-color:#2a5552;background:#0e1a1d}
.tool:active{transform:scale(.985)}
.tool .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#132a2b;color:var(--acc);flex:none}
.tool .n{color:var(--white);font-weight:600;font-size:13px}
.tool .s{color:var(--muted);font-size:11.5px;margin-top:1px}

.flist{margin-top:16px;display:flex;flex-direction:column;gap:2px;min-width:540px;max-width:640px}
.fi{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:9px 2px;border-top:1px solid var(--row)}
.fi:first-child{border-top:0}
.fi .n{color:var(--white);font-weight:600;font-size:13px}
.fi .s{color:var(--muted2);font-size:12px;margin-top:1px}
.fi .w{color:#eab308;font-size:12px;margin-top:2px}
.fi .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.fi .st svg{width:13px;height:13px;stroke-width:3}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid #1f3a3a;border-top-color:var(--acc);animation:rot .8s linear infinite}
</style>
</head>
<body>

<section id="home">
  <div class="home-wrap">
    <div class="orb">
      <div class="ripple"></div><div class="ripple b"></div>
      <svg class="ring" viewBox="0 0 300 300">
        <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
        <circle class="trk" cx="150" cy="150" r="136"/>
        <circle class="prog" id="prog" cx="150" cy="150" r="136"/>
      </svg>
      <svg class="spin" viewBox="0 0 300 300"><g><circle cx="150" cy="150" r="118" stroke-dasharray="80 1000"/></g></svg>
      <button class="start" id="startBtn" aria-label="Start diagnosis">
        <svg class="wf" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></svg>
        <span>DIAGNOSE</span>
      </button>
      <div class="readout">
        <div class="pct"><span id="pct">0</span><small>%</small></div>
        <div class="step" id="step">&nbsp;</div>
        <svg class="mark" viewBox="0 0 74 74"><path d="M20 38l11 11 23-24"/></svg>
      </div>
    </div>
    <label class="site-in" id="siteIn">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span id="chips" style="display:contents"></span>
      <input id="siteBox" placeholder="Problem website (optional)" autocomplete="off" spellcheck="false">
    </label>
  </div>
</section>

<section id="report">
  <header class="bar">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" style="color:#2dd4bf"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><path d="M12 8.5l3 1.75v3.5L12 15.5l-3-1.75v-3.5z" fill="currentColor" stroke="none"/></svg></span>CoreKit<span class="mod">Internet Troubleshooter</span></div>
    <button class="btn ghost" id="bRetest"></button>
    <button class="btn" id="bSave"></button>
    <button class="btn primary" id="bFixAll"></button>
  </header>
  <div class="scroll" id="scroll"><main class="rep" id="rep"></main></div>
</section>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"><span class="d"></span><span id="tmsg"></span><a id="tact"></a></div>

<script>
'use strict';
const TOKEN = location.pathname.split('/')[1];
const API = '/' + TOKEN + '/api/';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => x == null ? [] : Array.isArray(x) ? x : [x];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const has = v => v !== null && v !== undefined && v !== '';

/* ---------- icons ---------- */
const I = {
  back:'<path d="M15 18l-6-6 6-6"/>',
  pc:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  wifi:'<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/>',
  router:'<rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 17h.01M10 17h.01M15 13V9M12 6.5a4 4 0 0 1 6 0M10 4a7.5 7.5 0 0 1 10 0"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  dns:'<rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 6.5h.01M6 17.5h.01M10 6.5h8M10 17.5h8"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  down:'<path d="M12 5v14M19 12l-7 7-7-7"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  save:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
  wand:'<path d="m15 4-1 1M19 8l1-1M19 4l1 1M15 8l-1-1M17 6l-11 11 1 1L18 7z"/><path d="M3 21l3-3"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  plug:'<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/>',
  power:'<path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  chip:'<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>',
};
const ico = (n, st) => `<svg class="i" viewBox="0 0 24 24"${st ? ` style="${st}"` : ''}>${I[n]}</svg>`;
(() => {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b151b"/><path d="M32 11l18.2 10.5v21L32 53 13.8 42.5v-21z" fill="none" stroke="#2dd4bf" stroke-width="4.5" stroke-linejoin="round"/><path d="M32 24l6.9 4v8L32 40l-6.9-4v-8z" fill="#2dd4bf"/></svg>`;
  $('#fav').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
})();

/* ---------- heartbeat ---------- */
const ping = () => fetch(API + 'ping', {cache: 'no-store'}).catch(() => {});
ping(); setInterval(ping, 1000);
addEventListener('pagehide', () => navigator.sendBeacon(API + 'bye'));

/* ---------- fix catalogue ---------- */
const ANDROID = !!window.CoreKitNative; // same screen, Android app host
const FIX = {
  'flushdns': {n: 'Flush DNS cache', d: 'Clears stored website addresses', ic: 'trash'},
  'dns:cloudflare': {n: 'Use Cloudflare DNS', d: '1.1.1.1 · fast and private, encrypted on Windows 11', ic: 'dns'},
  'dns:google': {n: 'Use Google DNS', d: '8.8.8.8 · reliable, encrypted on Windows 11', ic: 'dns'},
  'dns:quad9': {n: 'Use Quad9 DNS', d: '9.9.9.9 · blocks malicious sites', ic: 'dns'},
  'dns:opendns': {n: 'Use OpenDNS', d: '208.67.222.222', ic: 'dns'},
  'dns:auto': {n: 'Automatic DNS', d: 'Back to the router / ISP DNS', ic: 'dns'},
  'renew-ip': {n: 'Renew IP address', d: 'Gets a fresh address from the router', ic: 'refresh', w: 'Internet drops for a few seconds'},
  'restart-adapter': {n: 'Restart network adapter', d: 'Turns Wi-Fi / Ethernet off and on', ic: 'power', w: 'Internet drops for a few seconds'},
  'enable-adapters': {n: 'Enable network adapters', d: 'Turns on disabled adapters', ic: 'plug'},
  'sync-time': {n: 'Sync clock', d: 'Fixes wrong date / time ("not secure" errors)', ic: 'clock'},
  'reset-proxy': {n: 'Reset proxy', d: 'Removes user and system proxy settings', ic: 'globe'},
  'clear-cert-cache': {n: 'Clear certificate cache', d: 'Clears SSL, CRL and OCSP cache', ic: 'shield'},
  'update-roots': {n: 'Update root certificates', d: 'Latest trusted roots from Windows Update', ic: 'lock'},
  'clear-browser-cache': {n: 'Clear browser cache', d: 'Edge, Chrome, Brave, Firefox, Opera', ic: 'layers', w: 'Open browsers will close. Cookies and passwords are kept.'},
  'reset-hosts': {n: 'Reset hosts file', d: 'Removes website redirects (backup saved)', ic: 'file'},
  'reset-stack': {n: 'Reset network stack', d: 'Winsock + TCP/IP reset', ic: 'settings', w: 'A PC restart is needed to finish'},
  'reboot': {n: 'Restart PC', d: 'Finishes the network reset', ic: 'power'},
  'open:portal': {n: 'Open Wi-Fi login page', ic: 'globe'},
  'open:wifi': {n: 'Open Wi-Fi settings', ic: 'wifi'},
  'open:devmgmt': {n: 'Device Manager', d: 'Check network drivers', ic: 'chip'},
  'open:network': {n: 'Network settings', d: 'Windows network status', ic: 'settings'},
  'open:ncpa': {n: 'Network connections', d: 'Adapters control panel', ic: 'plug'},
  'open:privatedns': {n: 'Private DNS settings', d: 'Encrypted DNS for the whole phone', ic: 'dns'},
  'open:datetime': {n: 'Date & time settings', d: 'Turn on automatic time', ic: 'clock'},
  'open:mobile': {n: 'Mobile data settings', ic: 'globe'},
  'open:vpn': {n: 'VPN settings', ic: 'shield'},
};
if (ANDROID) for (const [k, n] of [['cloudflare', 'Cloudflare'], ['google', 'Google'], ['quad9', 'Quad9'], ['opendns', 'OpenDNS']])
  FIX['dns:' + k] = {n: `Use ${n} Private DNS`, d: 'Copies the name, opens Private DNS: paste it there', ic: 'dns'};
if (ANDROID) FIX['dns:auto'] = {n: 'Automatic Private DNS', d: 'Opens Private DNS settings', ic: 'dns'};
const EST = {'flushdns': 2, 'renew-ip': 30, 'restart-adapter': 20, 'enable-adapters': 8, 'sync-time': 10, 'reset-proxy': 2, 'clear-cert-cache': 3, 'update-roots': 30, 'clear-browser-cache': 10, 'reset-hosts': 2, 'reset-stack': 8, 'reboot': 2};
const est = a => EST[a] || (a.startsWith('dns:') ? 5 : 3);
const fmtSec = n => n < 60 ? `${n} s` : `${Math.floor(n / 60)} min ${n % 60 ? (n % 60) + ' s' : ''}`.trim();
const ORDER = ['enable-adapters', 'sync-time', 'reset-proxy', 'reset-hosts', 'dns:cloudflare', 'dns:google', 'dns:quad9', 'dns:opendns', 'dns:auto', 'flushdns', 'clear-cert-cache', 'update-roots', 'renew-ip', 'restart-adapter', 'clear-browser-cache', 'reset-stack', 'reboot'];

/* ---------- state ---------- */
let DATA = null, sites = [], banner = null, lastSpeed = null;
const SEV = {critical: ['CRITICAL', '#ef4444'], warning: ['WARNING', '#eab308'], info: ['INFO', '#60a5fa']};
const ST = {ok: ['#22c55e', 'rgba(34,197,94,.10)', 'rgba(34,197,94,.25)'], warn: ['#eab308', 'rgba(234,179,8,.10)', 'rgba(234,179,8,.22)'], fail: ['#ef4444', 'rgba(239,68,68,.10)', 'rgba(239,68,68,.28)'], idle: ['#3a4757', 'rgba(58,71,87,.10)', 'transparent']};
const pill = (t, c) => `<span class="pill" style="color:${c};border-color:${c}55;background:${c}14">${esc(t)}</span>`;

/* ---------- site input ---------- */
function cleanSite(s) {
  s = String(s || '').trim().toLowerCase().replace(/^[a-z]+:\/\//, '').replace(/[\/?#:].*$/, '');
  return /^[a-z0-9]([a-z0-9.\-]{0,251}[a-z0-9])?$/.test(s) && s.includes('.') ? s : null;
}
function drawChips() { $('#chips').innerHTML = sites.map((s, i) => `<span class="chip">${esc(s)}<b data-rm="${i}">×</b></span>`).join(''); $('#siteBox').placeholder = sites.length ? 'Add another' : 'Problem website (optional)'; }
function addSites(v) { for (const p of String(v).split(/[\s,]+/)) { const c = cleanSite(p); if (c && !sites.includes(c) && sites.length < 5) sites.push(c); } drawChips(); }
$('#siteBox').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',' || e.key === ' ') { e.preventDefault(); const v = e.target.value; e.target.value = ''; if (v.trim()) addSites(v); else if (e.key === 'Enter') startScan(true); }
  else if (e.key === 'Backspace' && !e.target.value && sites.length) { sites.pop(); drawChips(); }
});
$('#siteBox').addEventListener('blur', e => { if (e.target.value.trim()) { addSites(e.target.value); e.target.value = ''; } });
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { e.preventDefault(); sites.splice(+b.dataset.rm, 1); drawChips(); } });

/* ---------- orb progress ---------- */
const prog = $('#prog'), C = 2 * Math.PI * 136;
prog.style.strokeDasharray = C; prog.style.strokeDashoffset = C;
let target = 0, shown = 0, scanning = false, rafOn = false;
function frame() {
  if (shown < target) shown += Math.max(.12, (target - shown) * .07);
  else if (scanning && shown < Math.min(97, target + 5)) shown += .016;
  shown = Math.min(shown, 100);
  prog.style.strokeDashoffset = C * (1 - shown / 100);
  $('#pct').textContent = Math.floor(shown);
  if (scanning || shown < target) requestAnimationFrame(frame); else rafOn = false;
}
function kick() { if (!rafOn) { rafOn = true; requestAnimationFrame(frame); } }
function setStep(t) {
  const el = $('#step');
  if (el.dataset.t === t) return;
  const same = el.dataset.t && el.dataset.t.split('  ')[0] === t.split('  ')[0];
  el.dataset.t = t;
  if (same) { el.textContent = t; return; }
  el.classList.add('swap');
  setTimeout(() => { el.textContent = el.dataset.t; el.classList.remove('swap'); }, 170);
}

/* ---------- scan ---------- */
function startScan(withSpeed = true) {
  if (scanning) return;
  const v = $('#siteBox').value; if (v.trim()) { addSites(v); $('#siteBox').value = ''; }
  scanning = true; target = 0; shown = 0;
  document.body.classList.remove('done');
  document.body.classList.add('scanning');
  setStep('Preparing'); kick();
  let finished = false;
  const es = new EventSource(`${API}net/scan?sites=${encodeURIComponent(sites.join(','))}&speed=${withSpeed ? 1 : 0}`);
  es.addEventListener('progress', e => { const d = JSON.parse(e.data); target = Math.max(target, Math.min(99, d.pct)); setStep(d.label); kick(); });
  es.addEventListener('done', e => { finished = true; es.close(); const d = JSON.parse(e.data); finish(d); });
  es.addEventListener('fail', e => { finished = true; es.close(); failed(JSON.parse(e.data).error); });
  es.onerror = () => { if (!finished) { finished = true; es.close(); failed('Connection to the diagnostic engine was lost.'); } };
}
async function finish(d) {
  if (d.speed && d.speed.ok) lastSpeed = {...d.speed, stale: false};
  else if (lastSpeed) lastSpeed.stale = true;
  if (banner && banner.prev) {
    const now = new Set(arr(d.net.issues).filter(i => i.sev !== 'info').map(i => i.id));
    const prev = banner.prev.filter(i => i.sev !== 'info');
    banner.fixed = prev.filter(i => !now.has(i.id)).length;
    banner.total = prev.length; banner.left = now.size; banner.prev = null;
  }
  DATA = d;
  scanning = false; target = 100; kick();
  while (shown < 99.9) await sleep(30);
  document.body.classList.add('done');
  await sleep(800);
  const home = $('#home');
  home.classList.add('leave');
  render(true);
  $('#report').classList.add('active');
  await sleep(500);
  home.classList.add('gone');
  document.body.classList.remove('scanning', 'done');
}
function failed(msg) {
  scanning = false; target = 0; shown = 0;
  document.body.classList.remove('scanning', 'done');

}

function retest(withSpeed = true) {

  $('#report').classList.remove('active');
  const home = $('#home');

}

/* ---------- report ---------- */
function verdict(N) {

  rep.classList.toggle('static', !anim);
  if (anim) { sc.scrollTop = 0; rep.querySelectorAll('.cnt').forEach(countUp); } else sc.scrollTop = y;
  const n = fixAllList().length;
  $('#bFixAll').innerHTML = ico('wand') + (n ? `Fix All (${n})` : 'Fix All');
  $('#bFixAll').disabled = !n; $('#bFixAll').style.opacity = n ? 1 : .45;
  const as = $('#addSite');
  if (as) as.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addFromReport(); } });
}
function addFromReport() { banner = null; const v = $('#addSite').value; if (!cleanSite(v.split(/[\s,]+/)[0])) { toast('Enter a website like example.com', true); return; } addSites(v); retest(false); }

/* ---------- fixes ---------- */
let modalCleanup = null, modalLock = false;
function openModal(html, cleanup) { $('#sheet').innerHTML = html; modalCleanup = cleanup || null; $('#modal').classList.add('open'); }
function closeModal() { if (modalLock) return; if (modalCleanup) { try { modalCleanup(); } catch (e) {} modalCleanup = null; } $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-x]')) closeModal(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const stIcon = s => s === 'run' ? '<div class="spinner"></div>' : s === 'ok' ? `<span class="st" style="background:#22c55e22;color:#22c55e">${ico('check')}</span>` : s === 'bad' ? `<span class="st" style="background:#ef444422;color:#ef4444">${ico('x')}</span>` : `<span class="st" style="background:#1a2431"></span>`;

function requestFix(list, title) {
  const opens = list.filter(a => a.startsWith('open:'));
  opens.forEach(a => fetch(API + 'open?what=' + a.slice(5)).catch(() => {}));
  const acts = sortActs(list.filter(a => !a.startsWith('open:') && FIX[a]));
  if (!acts.length) { if (opens.length) toast(fixLabel(opens[0]) + ' opened'); return; }
  const warns = acts.filter(a => FIX[a].w);
  openModal(`<div class="sh-t">${esc(title || (acts.length > 1 ? `Run ${acts.length} repairs` : fixLabel(acts[0])))}</div><div class="sh-s">${warns.length ? 'Some steps briefly interrupt the connection.' : 'Safe to run. Results are re-tested automatically.'} Estimated time: about ${fmtSec(acts.reduce((t, a) => t + est(a), 0))}.</div>
    <div class="flist">${acts.map(a => `<div class="fi"><span class="st" style="background:#132a2b;color:#2dd4bf">${ico(FIX[a].ic)}</span><div><div class="n">${esc(FIX[a].n)}</div><div class="s">${esc(FIX[a].d || '')}</div>${FIX[a].w ? `<div class="w">${esc(FIX[a].w)}</div>` : ''}</div></div>`).join('')}</div>
    <div class="sh-f"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="goFix">${ico('wand')}${acts.length > 1 ? `Run ${acts.length} repairs` : 'Run'}</button></div>`);
  $('#goFix').onclick = () => runFix(acts);
}

async function runFix(acts) {
  modalLock = true;
  const state = Object.fromEntries(acts.map(a => [a, 'wait'])), msg = {};
  const total = acts.reduce((t, a) => t + est(a), 0), t0 = Date.now();
  const elapsed = () => { const e = Math.round((Date.now() - t0) / 1000); return `${Math.floor(e / 60)}:${String(e % 60).padStart(2, '0')}`; };
  const draw = () => {
    $('#sheet').innerHTML = `<div class="sh-t">Repairing…</div><div class="sh-s"><span id="fxt">Elapsed ${elapsed()}</span> · usually about ${fmtSec(total)}. Keep this window open.</div>
      <div class="flist">${acts.map(a => `<div class="fi">${stIcon(state[a])}<div><div class="n">${esc(FIX[a].n)}</div><div class="s">${esc(msg[a] || FIX[a].d || '')}</div></div></div>`).join('')}</div><div class="sh-f" id="fxf"></div>`;
  };
  draw();
  const tick = setInterval(() => { const el = $('#fxt'); if (el) el.textContent = 'Elapsed ' + elapsed(); }, 1000);
  const stop = (err) => { clearInterval(tick); modalLock = false; if (err) { closeModal(); toast(err, true); } };
  let id;
  try {
    const r = await fetch(`${API}net/fix?actions=${encodeURIComponent(acts.join(','))}`, {method: 'POST'});
    if (!r.ok) throw new Error(r.status === 409 ? 'Another task is still running.' : await r.text());
    id = (await r.json()).id;
  } catch (e) { stop('Could not start repair: ' + e.message); return; }
  let since = 0, cur = null, misses = 0, res = null;
  while (true) {
    await sleep(600);
    let st;
    try { st = await (await fetch(`${API}net/fixstatus?id=${id}&since=${since}`, {cache: 'no-store'})).json(); misses = 0; }
    catch (e) { if (++misses > 300) { stop('Lost contact with the repair engine.'); return; } continue; }   // network changing: keep waiting
    for (const ev of arr(st.events)) {
      if (ev.type === 'progress' && state[ev.text]) { if (cur && state[cur] === 'run') state[cur] = 'ok'; cur = ev.text; state[cur] = 'run'; }
    }
    since = st.next;
    if (st.done) { if (st.error) { stop('Repair failed: ' + st.error); return; } res = st.result || {}; break; }
    draw();
  }
  clearInterval(tick);
  for (const x of arr(res.results)) { state[x.id] = x.ok ? 'ok' : 'bad'; msg[x.id] = x.msg; }
  draw();
  $('#fxt').textContent = 'Finished in ' + elapsed();
  const allOk = arr(res.results).every(x => x.ok); $('#sheet .sh-t').textContent = allOk ? 'Repair complete' : 'Repair finished with errors';
  const prev = arr(DATA.net.issues).map(i => ({id: i.id, sev: i.sev}));
  banner = {prev, actions: acts, reboot: !!res.reboot};
  modalLock = false;
  if (res.reboot) {
    $('#fxf').innerHTML = `<span class="l">Restart the PC to finish the network reset.</span><button class="btn ghost" data-x>Later</button><button class="btn primary" id="rb">${ico('power')}Restart now</button>`;
    $('#rb').onclick = () => { closeModal(); runFix(['reboot']); };
    modalCleanup = () => retest(false);
  } else if (acts.length === 1 && acts[0] === 'reboot') {
    $('#fxf').innerHTML = `<span class="l">Restarting in 15 seconds…</span>`;
  } else {
    $('#fxf').innerHTML = `<span class="l">Re-testing your connection…</span>`;
    setTimeout(() => retest(false), 1500);
  }
}

/* ---------- toast / save ---------- */
let toastT;
function toast(m, err, act) {
  const t = $('#toast'); $('#tmsg').textContent = m;
  const a = $('#tact'); a.textContent = act ? act.label : ''; a.onclick = act ? act.fn : null;
  t.classList.toggle('err', !!err); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), act ? 6000 : 3500);
}
function exportHTML() {
  const css = $('#css').textContent, b = banner; banner = null;
  const body = reportHTML().replace(/<div class="card tools-card"[\s\S]*$/, '');
  banner = b;
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CoreKit Network Report - ${esc(DATA.net.host)}</title><style>${css} html,body{height:auto!important;overflow:auto!important} .btn,.addsite{display:none!important}</style></head><body class="export"><main class="rep static">${body}</main></body></html>`;
}
async function saveReport() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `CoreKit-Network_${String(DATA.net.host || 'PC').replace(/[^\w\-]+/g, '')}_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
  try {
    const N = window.CoreKitNative;
    if (N) { // Android: saved to Downloads/CoreKit
      const j = JSON.parse(N.save(name, exportHTML()));
      if (j.error) throw new Error(j.error);
      toast('Saved to ' + j.label, false, {label: 'Open', fn: () => N.open(j.path)});
      return;
    }
    const r = await fetch(API + 'save', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name, html: exportHTML()})});
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    toast('Report saved', false, {label: 'Show in folder', fn: () => fetch(API + 'reveal', {method: 'POST', body: JSON.stringify({path: j.path})})});
  } catch (e) { toast('Could not save: ' + e.message, true); }
}

/* ---------- wiring ---------- */
$('#startBtn').addEventListener('click', () => startScan(true));
$('#bRetest').innerHTML = ico('refresh') + 'Re-test';
$('#bSave').innerHTML = ico('save') + 'Save Report';
$('#bRetest').onclick = () => { banner = null; retest(true); };
$('#bSave').onclick = saveReport;
if (innerWidth < 600) $('.brand .mod').textContent = 'Internet';
if (ANDROID) $('.brand').insertAdjacentHTML('afterbegin', `<button class="back" onclick="CoreKitNative.go('home')" aria-label="Back">${ico('back')}</button>`);
$('#bFixAll').onclick = () => { const l = fixAllList(); if (l.length) requestFix(l, `Fix all problems (${l.length} repairs)`); };
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fix]');
  if (f) { requestFix(f.dataset.fix.split(',')); return; }
  const a = e.target.closest('[data-act]');
  if (a && a.dataset.act === 'speed') retest(true);
  if (a && a.dataset.act === 'addsite') addFromReport();
});
document.addEventListener('contextmenu', e => { if (!e.target.closest('input')) e.preventDefault(); });
</script>
</body>

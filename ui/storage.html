<!DOCTYPE html>
<html lang="en" style="background:#0a0e13">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storage & Performance · CoreKit</title>
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#0a0e13;--panel:#10161e;--panel2:#0c1219;--line:#1a2431;--line2:#243142;--acc:#38bdf8;--accd:#0f2838;--white:#f0f6fc;--text:#c9d1d9;--muted:#6b7785;--muted2:#8b98a5;--red:#f87171;--redb:#3a1518;--amber:#fbbf24;--amberb:#2a2410;--green:#34d399;--greenb:#0f2a20;--violet:#a78bfa;--font:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(800px 460px at 50% -12%,rgba(56,189,248,.10),transparent 70%),var(--bg);min-height:100vh}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px calc(130px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 2px 12px;background:linear-gradient(180deg,var(--bg) 72%,rgba(10,14,19,0))}
.top .ic{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#123a52,#0f2838);color:var(--acc);display:grid;place-items:center;flex:none;border:1px solid #17445c}
.top h1{margin:0;font:650 19px var(--font);color:var(--white);letter-spacing:-.2px}
.top p{margin:1px 0 0;color:var(--muted2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#141c26;color:var(--white);font-weight:600;font-size:13.5px;transition:transform .1s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:#34475e}.btn:active{transform:scale(.97)}.btn svg{width:17px;height:17px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04222f}.btn.pri:hover{background:#5ccaf9}
.btn.dng{background:var(--red);border-color:var(--red);color:#1c0b0d}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn.gho{background:transparent}
.btn[disabled]{opacity:.5;pointer-events:none}

/* scanning */
.scan{max-width:460px;margin:0 auto;text-align:center;padding:70px 20px}
.radar{position:relative;width:96px;height:96px;margin:0 auto 22px}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line2)}
.radar i:nth-child(2){inset:16px}.radar i:nth-child(3){inset:32px;background:var(--acc);border:0;opacity:.9}
.radar b{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--acc);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scan h2{margin:0 0 6px;color:var(--white);font:600 18px var(--font)}
.scan p{color:var(--muted2);margin:0 auto}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:22px auto 6px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0ea5e9,#38bdf8);transition:width .35s}
.scan small{color:var(--muted)}

/* summary */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:24px;border-radius:20px;background:linear-gradient(180deg,#111a24,#0e151d);border:1px solid var(--line);margin-top:2px}
.ring{position:relative;width:140px;height:140px}
.ring svg{width:140px;height:140px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font:700 30px/1 var(--font);color:var(--white)}.ring .c span{font-size:12px;color:var(--muted2);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:13px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.stat small{display:block;color:var(--muted2);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat b{display:block;color:var(--white);font:650 21px/1.2 var(--font);margin-top:3px}
.stat.hl{background:var(--accd);border-color:#17445c}.stat.hl b{color:var(--acc)}
.hero .cta{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:2px}
.hero .cta p{margin:0;flex:1;min-width:200px;color:var(--muted2);font-size:13px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:16px 0 12px;position:sticky;top:calc(72px + env(safe-area-inset-top));background:var(--bg);z-index:25;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted2);font-weight:600;font-size:13px;white-space:nowrap}
.tab.on{background:var(--panel);border-color:var(--line2);color:var(--white)}
.tab em{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:#1a2431;color:var(--muted2)}
.tab.on em{background:var(--accd);color:var(--acc)}

/* cards & rows */
.card{border-radius:18px;background:var(--panel);border:1px solid var(--line);margin-bottom:14px;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.ch h3{margin:0;font:650 15px var(--font);color:var(--white);flex:1}
.ch small{color:var(--muted2);font-size:12.5px}
.cd{padding:0 18px 12px;color:var(--muted2);font-size:12.5px}
.row{display:flex;align-items:center;gap:13px;padding:12px 18px;border-top:1px solid var(--line)}
.ch + .row,.cd + .row{border-top:1px solid var(--line)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;color:var(--white);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--muted);font-size:12px;overflow:hidden;word-break:break-word}
.row .sz{min-width:78px;text-align:right}
.row .sz b{display:block;color:var(--white);font-weight:650;font-size:13.5px;white-space:nowrap}
.mini{height:4px;border-radius:2px;background:#182230;margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:2px;background:var(--acc)}
.mini.g i{background:var(--green)}.mini.r i{background:var(--red)}.mini.y i{background:var(--amber)}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:#131c27;color:var(--muted2)}
.ico.a{background:var(--accd);color:var(--acc)}.ico.r{background:var(--redb);color:var(--red)}.ico.g{background:var(--greenb);color:var(--green)}.ico.y{background:var(--amberb);color:var(--amber)}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;font:700 15px var(--font);text-transform:uppercase}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:6px;margin-left:7px;vertical-align:middle;background:#1b2634;color:var(--muted2)}
.tag.red{background:var(--redb);color:var(--red)}.tag.amber{background:var(--amberb);color:var(--amber)}.tag.green{background:var(--greenb);color:var(--green)}.tag.blue{background:var(--accd);color:var(--acc)}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;transition:all .12s;background:#0c121a}
.ck.on{background:var(--acc);border-color:var(--acc)}
.ck svg{width:13px;height:13px;color:#04222f;opacity:0;stroke-width:3.5}.ck.on svg{opacity:1}
.ck.lock{border-color:transparent;background:transparent;color:var(--muted)}.ck.lock svg{opacity:.7;color:var(--muted);width:15px;height:15px;stroke-width:2}
.selrow{cursor:pointer;transition:background .12s}.selrow:hover{background:#121b25}.selrow:active{background:#152130}
.selrow.dis{cursor:default;opacity:.6}.selrow.dis:hover{background:transparent}

/* drives */
.dbar{height:16px;border-radius:8px;overflow:hidden;display:flex;gap:2px;background:#0c121a;margin:12px 0 12px}
.dbar i{height:100%;min-width:2px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 18px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted2);min-width:0}
.legend .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{color:var(--white);font-weight:600}
.legend em{font-style:normal;color:var(--muted);width:38px;text-align:right}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dhead b{color:var(--white);font-size:15.5px}.dhead span{color:var(--muted2);font-size:12.5px}

/* toolbar, search, chips */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.search{flex:1;min-width:170px;display:flex;align-items:center;gap:8px;padding:0 13px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line2)}
.search:focus-within{border-color:var(--acc)}
.search input{flex:1;min-width:0;background:0;border:0;outline:0;color:var(--white);font-size:14px}
.search svg{width:16px;height:16px;color:var(--muted)}
select.sel{height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);color:var(--white);padding:0 12px;font:inherit;font-size:13px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--muted2);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip em{font-style:normal;opacity:.7;margin-left:5px;font-weight:500}
.chip.on{background:var(--accd);border-color:var(--acc);color:var(--acc)}
.count{color:var(--muted2);font-size:12.5px;margin:2px 2px 10px}

/* overview */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.fact{padding:15px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.fact .ico{margin-bottom:10px}
.fact b{display:block;color:var(--white);font:650 22px/1.1 var(--font)}
.fact small{display:block;color:var(--muted2);font-size:12.5px;margin-top:3px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.cols .card{margin-bottom:0}

/* group headings */
.gh{display:flex;align-items:center;gap:10px;margin:18px 2px 8px}
.gh h4{margin:0;font:650 12px var(--font);letter-spacing:.7px;text-transform:uppercase;color:var(--muted2);flex:1}
.gh span{color:var(--muted2);font-size:12.5px}

/* floating bar */
.fab{position:fixed;left:50%;transform:translateX(-50%) translateY(150%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:14px;padding:11px 12px 11px 18px;border-radius:18px;background:#111a24;border:1px solid var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.6);transition:transform .25s cubic-bezier(.2,.8,.2,1);width:min(560px,calc(100% - 24px))}
.fab.show{transform:translateX(-50%)}
.fab .fx{min-width:0;flex:1}.fab .fx b{display:block;color:var(--white);font-size:14px;white-space:nowrap}.fab .fx small{display:block;color:var(--muted2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* notes, empty */
.note{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;font-size:13px;line-height:1.5;margin-bottom:14px}
.note.warn{background:#241d0e;border:1px solid #4d3a12;color:#fde68a}
.note b{color:#fff3c4}
.note svg{width:20px;height:20px;flex:none}
.note .grow{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:44px 20px}
.lead{color:var(--muted2);margin:2px 2px 8px;font-size:13.5px}
.gr{color:var(--green)}

/* modal */
.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(3,6,9,.82);padding:20px}
.modal.show{display:grid}
.dlg{width:480px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;border-radius:20px;background:#0f151d;border:1px solid var(--line2);padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.dlg.wide{width:640px}
.dlg h3{margin:0 0 6px;color:var(--white);font:650 17px var(--font)}
.dlg p{margin:0 0 14px;color:var(--muted2);font-size:13.5px;line-height:1.5}
.dlg .mlist{flex:1;min-height:0;overflow:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:12px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 13px;font-size:13px;border-bottom:1px solid var(--line)}
.mrow:last-child{border:0}
.mrow>span:first-child{color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:9px}
.mrow b{color:var(--white);white-space:nowrap}
.mrow.go{cursor:pointer}.mrow.go:hover{background:#121b25}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.crumb p{margin:0;flex:1;min-width:0;word-break:break-all;font-size:12.5px}
.drow{display:flex;gap:10px}.drow .btn{flex:1}
.pickbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--line);background:var(--panel2)}
.pickbar span{flex:1;min-width:140px;color:var(--muted2);font-size:12.5px}
.pickrow{display:flex;align-items:center;gap:11px;padding:9px 18px;border-top:1px solid var(--line);cursor:pointer}
.pickrow:hover{background:#121b25}
.pickrow .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-size:13px}
.pickrow small{color:var(--muted);font-size:12px;white-space:nowrap}
.pickrow b{color:var(--white);font-size:13px;white-space:nowrap;min-width:64px;text-align:right}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#16212d;border:1px solid var(--line2);color:var(--white);padding:10px 16px;border-radius:12px;font-size:13px;transition:all .25s;z-index:90;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:#5a2a31;color:#fecaca}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;display:inline-block;animation:spin .8s linear infinite;vertical-align:-3px}

@media(max-width:760px){
  .facts{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}.cols .card{margin-bottom:14px}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center;padding:20px 16px}
  .stats{width:100%}
  .hero .cta{justify-content:center}.hero .cta p{text-align:center}
}
@media(max-width:560px){
  .wrap{padding-left:12px;padding-right:12px}
  .stat b{font-size:17px}.stat{padding:11px 10px}.stat small{font-size:10.5px}
  .row{padding:11px 13px;gap:11px}.ch{padding:14px 13px 6px}.cd{padding:0 13px 10px}
  .row .sz{min-width:64px}
  .modal{place-items:end center;padding:0}
  .dlg,.dlg.wide{width:100%;border-radius:22px 22px 0 0;max-height:90vh;padding:20px 16px calc(18px + env(safe-area-inset-bottom))}
  .legend{grid-template-columns:1fr 1fr}
  .tab{padding:8px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg></div>
    <div style="flex:1;min-width:0"><h1>Storage &amp; Performance</h1><p id="sub">Free up space and remove what you don't need</p></div>
    <button class="btn sm gho" id="rescan" style="display:none" data-a="scan"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>Rescan</button>
  </div>
  <div id="inner"></div>
</div>

<div class="fab" id="fab"><div class="fx"><b id="fabN">0 selected</b><small id="fabS"></small></div><button class="btn gho sm" id="fabClear">Clear</button><button class="btn pri sm" id="fabGo">Remove</button></div>
<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>

<script>
"use strict";
const TOKEN = location.pathname.split('/')[1];
const API = '/' + TOKEN + '/api/';
const N = window.CoreKitNative;
const ANDROID = !!(N && N.stCall);
const DEV = ANDROID ? 'phone' : 'PC';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if (!ANDROID) { const p = () => fetch(API + 'ping', {cache:'no-store'}).catch(() => {}); p(); setInterval(p, 1000); }

const IC = {
  drive:'<rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/>',
  app:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>',
  broom:'<path d="M19.4 4.6 15 9M11 7l6 6M3 21l4-1 10-10-3-3L4 17z"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
  check:'<path d="M5 12l5 5L20 6"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  warn:'<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  rocket:'<path d="M5 13c-1.5 1.3-2 5-2 5s3.7-.5 5-2M12 4c3 0 7 4 7 7-2 2-5 5-7 5s-5-3-5-5c0-2 2-7 5-7z"/><circle cx="12" cy="9" r="1.2"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  bloat:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const ico = k => `<svg class="i" viewBox="0 0 24 24">${IC[k] || ''}</svg>`;
function size(b){ b = +b || 0; const G = 1073741824, M = 1048576; if (b >= G) return (b/G).toFixed(b >= 10*G ? 0 : 1) + ' GB'; if (b >= M) return (b/M).toFixed(b >= 100*M ? 0 : 1) + ' MB'; if (b >= 1024) return Math.round(b/1024) + ' KB'; return b + ' B'; }
function ago(ts){ if (!ts) return ''; const d = Math.floor((Date.now()/1000 - ts)/86400); if (d < 1) return 'today'; if (d < 30) return d + 'd ago'; if (d < 365) return Math.floor(d/30) + 'mo ago'; return Math.floor(d/365) + 'y ago'; }
const PAL = ['#38bdf8','#a78bfa','#34d399','#fbbf24','#f472b6','#fb923c','#2dd4bf','#60a5fa'];
function hue(s){ let h = 0; s = String(s); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return PAL[h % PAL.length]; }
function avatar(name){ const c = hue(name); const ch = (String(name).match(/[A-Za-z0-9]/) || ['?'])[0]; return `<span class="av" style="background:${c}22;color:${c}">${esc(ch)}</span>`; }
const pctOf = (a, b) => b > 0 ? Math.min(100, Math.max(0, a / b * 100)) : 0;
const bar = (v, max, cls) => `<div class="mini ${cls || ''}"><i style="width:${Math.max(2, pctOf(v, max)).toFixed(1)}%"></i></div>`;

let seq = 0; const waits = {};
window.__stReply = (id, res) => { const w = waits[id]; if (w) { delete waits[id]; w(res); } };
function call(path, body){
  if (ANDROID) return new Promise(res => { const id = 't' + (++seq); waits[id] = res; try { N.stCall(id, path, body ? JSON.stringify(body) : ''); } catch (e) { delete waits[id]; res({error:'Not available'}); } });
  return fetch(API + 'storage/' + path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})}).then(r => r.json()).catch(() => ({error:'CoreKit is not responding'}));
}
let toastT;
function toast(m, bad){ const t = $('#toast'); t.textContent = m; t.classList.toggle('bad', !!bad); t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3600); }

let RES = null, tab = new URLSearchParams(location.search).get('tab') || 'overview', pendingUsage = false;
const sel = { app: new Set(), clean: new Set(), rec: new Set() };
const dlPick = new Set(), dlSizes = {};
let dlFiles = null;

/* ---------- scan ---------- */
function startScan(){
  sel.app.clear(); sel.clean.clear(); sel.rec.clear(); dlPick.clear(); dlFiles = null; appLimit = 150;
  $('#rescan').style.display = 'none';
  syncFab();
  $('#inner').innerHTML = `<div class="scan"><div class="radar"><i></i><i></i><i></i><b></b></div><h2 id="sl">Scanning this ${DEV}…</h2><p>Reading every drive, ${ANDROID ? 'app' : 'program'} and folder so nothing is missed.</p><div class="pbar"><i id="pb"></i></div><small id="pp">0%</small></div>`;
  const es = new EventSource(API + 'storage/scan');
  es.addEventListener('progress', e => { const m = JSON.parse(e.data); const pb = $('#pb'), sl = $('#sl'), pp = $('#pp'); if (pb) pb.style.width = m.pct + '%'; if (pp) pp.textContent = m.pct + '%'; if (sl && m.label) sl.textContent = m.label + '…'; });
  es.addEventListener('done', e => { es.close(); try { RES = JSON.parse(e.data); } catch (x) { return fail('Could not read the result.'); } render(); });
  es.addEventListener('fail', e => { es.close(); let m = 'Scan failed.'; try { m = JSON.parse(e.data).error || m; } catch (x) {} fail(m); });
  es.onerror = () => { es.close(); if (!RES || $('#pb')) fail('The scan connection dropped.'); };
}
function fail(m){ $('#inner').innerHTML = `<div class="empty"><p>${esc(m)}</p><button class="btn pri" data-a="scan" style="margin-top:12px">Try again</button></div>`; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && pendingUsage) { pendingUsage = false; startScan(); } });
window.addEventListener('focus', () => { if (pendingUsage) { pendingUsage = false; startScan(); } });

/* ---------- categories ---------- */
const catOf = a => (a.system || a.source === 'system' || a.source === 'preinstalled') ? 'system' : a.source === 'store' ? 'store' : 'other';
const CATS = () => ANDROID
  ? [['all','All'],['bloat','Bloatware'],['store','Play Store'],['other','Sideloaded'],['system','System']]
  : [['all','All'],['bloat','Bloatware'],['other','Programs'],['store','Store apps'],['system','System']];
const inCat = (a, c) => c === 'all' ? true : c === 'bloat' ? a.bloat : catOf(a) === c;

/* ---------- render ---------- */
function render(){
  $('#rescan').style.display = '';
  const r = RES;
  const usedPct = r.total ? Math.round(r.used / r.total * 100) : 0;
  $('#sub').textContent = `${r.platform === 'android' ? 'Phone' : r.platform === 'windows' ? 'Windows PC' : 'Computer'} · scanned in ${Math.max(1, Math.round((r.ms || 0) / 1000))}s`;
  const col = usedPct >= 90 ? '#f87171' : usedPct >= 75 ? '#fbbf24' : '#38bdf8';
  const C = 2 * Math.PI * 58, off = C * (1 - usedPct / 100);
  let h = '';
  if ((r.needs || []).includes('usage')) {
    h += `<div class="note warn"><svg class="i" viewBox="0 0 24 24">${IC.warn}</svg><div class="grow"><b>Some details are hidden.</b> Allow Usage access to see exact app sizes, photos, videos and when each app was last used.</div><button class="btn sm pri" data-a="usage">Allow access</button></div>`;
  }
  h += `<div class="hero">
    <div class="ring"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="58" fill="none" stroke="#1a2431" stroke-width="13"/><circle cx="70" cy="70" r="58" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="c"><b>${usedPct}%</b><span>used</span></div></div>
    <div class="stats">
      <div class="stat"><small>Used</small><b class="num">${size(r.used)}</b></div>
      <div class="stat"><small>Free</small><b class="num">${size(r.free)}</b></div>
      <div class="stat hl"><small>Can free up</small><b class="num">${size(r.reclaim)}</b></div>
    </div>
    <div class="cta"><p>${r.reclaim > 0 ? `Safe junk adds up to <b class="gr">${size(r.reclaim)}</b>. It rebuilds on its own, so clearing it does no harm.` : `Nothing safe to clear right now. Check Recommendations for bigger savings.`}${r.note ? ' ' + esc(r.note) : ''}</p>${r.reclaim > 0 ? `<button class="btn pri" data-a="freeall">${ico('rocket')}Free up ${size(r.reclaim)}</button>` : ''}</div>
  </div>`;
  h += `<div class="tabs">
    ${tabBtn('overview', 'Overview', '')}
    ${tabBtn('drives', ANDROID ? 'Storage' : 'Drives', r.drives.length)}
    ${tabBtn('apps', ANDROID ? 'Apps' : 'Programs', r.appCount)}
    ${tabBtn('junk', 'Junk', r.clean.length)}
    ${tabBtn('tips', 'Advice', r.recs.length)}
  </div><div id="pane"></div>`;
  $('#inner').innerHTML = h;
  paint();
}
function tabBtn(id, label, n){ return `<button class="tab ${tab === id ? 'on' : ''}" data-tab="${id}">${label}${n ? `<em>${n}</em>` : ''}</button>`; }
function paint(){
  const p = $('#pane'); if (!p) return;
  p.innerHTML = tab === 'overview' ? overview() : tab === 'drives' ? drives() : tab === 'apps' ? apps() : tab === 'junk' ? junk() : tips();
  syncFab();
}

/* ---------- overview ---------- */
function overview(){
  const r = RES;
  const bl = r.apps.filter(a => a.bloat && !a.system);
  const junkTotal = r.clean.reduce((s, c) => s + (c.id === 'downloads' ? 0 : c.bytes), 0);
  const appBytes = r.apps.reduce((s, a) => s + a.size, 0);
  let h = `<div class="facts">
    <div class="fact"><span class="ico a">${ico('app')}</span><b class="num">${r.appCount}</b><small>${ANDROID ? 'Apps' : 'Programs'} · ${size(appBytes)}</small></div>
    <div class="fact"><span class="ico r">${ico('bloat')}</span><b class="num">${bl.length}</b><small>Bloatware · ${size(bl.reduce((s, a) => s + a.size, 0))}</small></div>
    <div class="fact"><span class="ico g">${ico('broom')}</span><b class="num">${size(junkTotal)}</b><small>Junk and caches</small></div>
    <div class="fact"><span class="ico y">${ico('clock')}</span><b class="num">${r.recs.filter(x => x.kind === 'app-unused' && !/^b-/.test(x.id)).length}</b><small>Not used in a long time</small></div>
  </div>`;
  h += `<div class="card"><div class="ch"><h3>${ANDROID ? 'Storage' : 'Drives'}</h3><small>${size(r.used)} of ${size(r.total)}</small></div><div style="padding:0 18px 8px">`;
  r.drives.forEach(d => h += driveBar(d, true));
  h += `</div></div>`;
  const top = r.big.slice(0, 6), maxB = top.length ? top[0].bytes : 1;
  const tipTop = r.recs.slice(0, 5);
  h += `<div class="cols">`;
  h += `<div class="card"><div class="ch"><h3>${ANDROID ? 'Biggest apps' : 'Biggest folders and files'}</h3><button class="btn sm gho" data-tab="drives">All</button></div>`;
  if (top.length) top.forEach(b => h += bigRow(b, maxB)); else h += `<div class="empty" style="padding:24px">Nothing large found.</div>`;
  h += `</div>`;
  h += `<div class="card"><div class="ch"><h3>Recommended to remove</h3><button class="btn sm gho" data-tab="tips">All</button></div>`;
  if (tipTop.length) tipTop.forEach(x => h += recRow(x)); else h += `<div class="empty" style="padding:24px">Your ${DEV} looks tidy.</div>`;
  h += `</div></div>`;
  return h;
}
function bigRow(b, max){
  const k = b.kind;
  return `<div class="row"><span class="ico ${k === 'app' ? 'a' : ''}">${ico(k === 'folder' ? 'folder' : k === 'app' ? 'app' : 'file')}</span><div class="tx"><b>${esc(b.name)}</b><small>${esc(k === 'app' ? (b.drive || '') : b.path)}</small></div><div class="sz"><b class="num">${size(b.bytes)}</b>${bar(b.bytes, max)}</div>${k === 'folder' ? `<button class="btn sm gho" data-drill="${esc(b.path)}" aria-label="Open">${ico('chev')}</button>` : ''}</div>`;
}

/* ---------- drives ---------- */
function driveBar(d, mini){
  const parts = (d.parts && d.parts.length) ? d.parts.slice() : [{name:'Used', bytes:d.used, color:'#38bdf8'}];
  const counted = parts.reduce((s, p) => s + p.bytes, 0);
  const free = Math.max(0, d.total - counted);
  const seg = parts.map(p => `<i style="width:${pctOf(p.bytes, d.total)}%;background:${p.color}" title="${esc(p.name)}"></i>`).join('') + `<i style="width:${pctOf(free, d.total)}%;background:#1a2431"></i>`;
  const rows = parts.filter(p => p.bytes > 0).map(p => `<div><i class="dot" style="background:${p.color}"></i><span class="n">${esc(p.name)}</span><b class="num">${size(p.bytes)}</b>${mini ? '' : `<em>${Math.round(pctOf(p.bytes, d.total))}%</em>`}</div>`).join('') + `<div><i class="dot" style="background:#2c3a4d"></i><span class="n">Free</span><b class="num">${size(d.free)}</b>${mini ? '' : `<em>${Math.round(pctOf(d.free, d.total))}%</em>`}</div>`;
  const tagH = d.kind === 'system' ? '<span class="tag blue">System</span>' : d.kind === 'removable' ? '<span class="tag">Removable</span>' : '';
  return `<div style="margin-bottom:${mini ? 16 : 4}px">
    <div class="dhead"><b>${esc(d.name)}${d.label ? ' · ' + esc(d.label) : ''}${tagH}</b><span class="num">${size(d.used)} / ${size(d.total)} · ${Math.round(pctOf(d.used, d.total))}%</span></div>
    <div class="dbar">${seg}</div>
    <div class="legend">${rows}</div>
  </div>`;
}
const showAll = {};
function drives(){
  const r = RES;
  let h = '';
  if (ANDROID) h += `<p class="lead">Android keeps other apps' files private, so the biggest things CoreKit can list are the apps themselves.</p>`;
  r.drives.forEach(d => {
    const all = r.big.filter(b => b.drive === d.name);
    const n = showAll[d.name] ? all.length : 10;
    const big = all.slice(0, n), max = all.length ? all[0].bytes : 1;
    h += `<div class="card"><div style="padding:18px 18px 6px">${driveBar(d)}</div>`;
    if (big.length){
      h += `<div class="ch" style="padding-top:12px"><h3>${ANDROID ? 'Biggest apps' : 'Biggest items on ' + esc(d.name)}</h3><small>${all.length} found</small></div>`;
      big.forEach(b => h += bigRow(b, max));
      if (all.length > n) h += `<div class="pickbar"><span>${all.length - n} more</span><button class="btn sm gho" data-showall="${esc(d.name)}">Show all ${all.length}</button></div>`;
    }
    h += `</div>`;
  });
  return h || `<div class="empty">No drives found.</div>`;
}

/* ---------- apps ---------- */
let appQ = '', appF = 'all', appD = 'all', appS = 'size', appLimit = 150;
function appList(){
  const q = appQ.toLowerCase();
  let list = RES.apps.filter(a => {
    if (q && !((a.name + ' ' + a.pub + ' ' + a.id).toLowerCase().includes(q))) return false;
    if (appD !== 'all' && a.drive !== appD) return false;
    return inCat(a, appF);
  });
  const by = { size:(x, y) => y.size - x.size, name:(x, y) => x.name.localeCompare(y.name),
    new:(x, y) => (y.installed || 0) - (x.installed || 0),
    old:(x, y) => (x.lastUsed || 9e12) - (y.lastUsed || 9e12) };
  return list.sort(by[appS]);
}
function apps(){
  const r = RES;
  const cats = CATS();
  const scope = r.apps.filter(a => (appD === 'all' || a.drive === appD));
  const drivesUsed = [...new Set(r.apps.map(a => a.drive).filter(Boolean))].sort();
  let h = `<div class="toolbar">
    <div class="search"><svg class="i" viewBox="0 0 24 24">${IC.search}</svg><input id="appSearch" placeholder="Search ${ANDROID ? 'apps' : 'programs'}" value="${esc(appQ)}" autocomplete="off"></div>
    <select class="sel" id="appSort" aria-label="Sort"><option value="size">Biggest first</option><option value="name">Name</option><option value="new">Newest installed</option><option value="old">Longest unused</option></select>
    ${drivesUsed.length > 1 ? `<select class="sel" id="appDrive" aria-label="Drive"><option value="all">All drives</option>${drivesUsed.map(d => `<option value="${esc(d)}">${esc(d)} drive</option>`).join('')}</select>` : ''}
  </div>
  <div class="toolbar"><div class="chips">${cats.map(([id, label]) => `<button class="chip ${appF === id ? 'on' : ''}" data-af="${id}">${label}<em>${scope.filter(a => inCat(a, id)).length}</em></button>`).join('')}</div></div>
  <div id="applist"></div>`;
  setTimeout(() => { const s = $('#appSort'); if (s) s.value = appS; const d = $('#appDrive'); if (d) d.value = appD; paintApps(); }, 0);
  return h;
}
function paintApps(){
  const box = $('#applist'); if (!box) return;
  const list = appList();
  const total = list.reduce((s, a) => s + a.size, 0);
  if (!list.length) { box.innerHTML = `<div class="empty">No matching ${ANDROID ? 'apps' : 'programs'}.</div>`; return; }
  const shown = list.slice(0, appLimit), max = list[0] && appS === 'size' ? list[0].size : Math.max(...shown.map(a => a.size), 1);
  const removable = list.filter(a => a.removable).length;
  box.innerHTML = `<div class="toolbar" style="justify-content:space-between"><span class="count" style="margin:0">Showing ${shown.length} of ${list.length} · ${size(total)}</span><span><button class="btn sm gho" data-selvis>Select all ${removable} removable</button></span></div>
    <div class="card">${shown.map(a => appRow(a, max)).join('')}${list.length > shown.length ? `<div class="pickbar"><span>${list.length - shown.length} more</span><button class="btn sm gho" data-more>Show ${Math.min(200, list.length - shown.length)} more</button></div>` : ''}</div>`;
  syncFab();
}
function appRow(a, max){
  const on = sel.app.has(a.id), dis = !a.removable;
  const badges = (a.bloat && !a.system ? '<span class="tag red">Bloatware</span>' : '') + (catOf(a) === 'store' ? `<span class="tag blue">${ANDROID ? 'Play Store' : 'Store'}</span>` : '') + (a.system ? '<span class="tag">System</span>' : '') + (ANDROID && a.source === 'sideloaded' ? '<span class="tag amber">Sideloaded</span>' : '');
  const meta = [ANDROID ? '' : a.pub, a.ver && 'v' + a.ver, !ANDROID ? a.drive : '', a.lastUsed ? 'used ' + ago(a.lastUsed) : (a.installed ? 'installed ' + ago(a.installed) : '')].filter(Boolean).join(' · ') || (ANDROID ? a.id : '');
  return `<div class="row selrow ${dis ? 'dis' : ''}" data-app="${esc(a.id)}">
    <span class="ck ${on ? 'on' : ''} ${dis ? 'lock' : ''}">${dis ? ico('lock') : ico('check')}</span>
    ${avatar(a.name)}
    <div class="tx"><b>${esc(a.name)}${badges}</b><small>${esc(meta)}</small></div>
    <div class="sz"><b class="num">${a.size ? (a.approx ? '~' : '') + size(a.size) : '—'}</b>${a.size ? bar(a.size, max, a.bloat ? 'r' : '') : ''}</div>
  </div>`;
}

/* ---------- junk ---------- */
const GROUPS = ['Browsers', 'Windows', 'Apps', 'Your files', ''];
function junk(){
  const r = RES;
  if (!r.clean.length) return `<div class="empty">No junk found — nothing to clear.</div>`;
  const max = Math.max(...r.clean.map(c => c.bytes), 1);
  let h = `<p class="lead">Caches, temporary files and leftovers. Items marked <span class="gr">Safe</span> rebuild on their own. Others need a quick look first.</p>
    <div class="toolbar"><button class="btn sm gho" data-selsafe>Select all safe</button></div>`;
  GROUPS.forEach(g => {
    const items = r.clean.filter(c => (c.group || '') === g);
    if (!items.length) return;
    const tot = items.reduce((s, c) => s + c.bytes, 0);
    h += `<div class="gh"><h4>${esc(g || 'Other')}</h4><span class="num">${size(tot)}</span></div><div class="card">`;
    items.forEach(c => h += cleanRow(c, max));
    h += `</div>`;
  });
  return h;
}
function cleanRow(c, max){
  const isDl = c.id === 'downloads', isAll = c.id === 'allcache';
  const on = isDl ? dlPick.size > 0 : sel.clean.has(c.id);
  const ic = isDl ? 'folder' : 'broom';
  const tagH = c.safe ? '<span class="tag green">Safe</span>' : '<span class="tag amber">Review</span>';
  const desc = isDl && dlPick.size ? `${dlPick.size} selected · ${size([...dlPick].reduce((s, p) => s + (dlSizes[p] || 0), 0))}` : c.desc;
  let h = `<div class="row selrow" data-clean="${esc(c.id)}">
    ${isAll ? `<span class="ico g">${ico(ic)}</span>` : `<span class="ck ${on ? 'on' : ''}">${ico('check')}</span><span class="ico ${c.safe ? 'g' : 'y'}">${ico(ic)}</span>`}
    <div class="tx"><b>${esc(c.name)}${tagH}</b><small>${esc(desc)}</small></div>
    <div class="sz"><b class="num">${size(c.bytes)}</b>${bar(c.bytes, max, c.safe ? 'g' : 'y')}</div>
    ${isDl ? `<button class="btn sm gho" data-dl aria-label="Choose files">${ico('chev')}</button>` : ''}
    ${isAll ? `<button class="btn sm gho" data-freeup>Open settings</button>` : ''}
  </div>`;
  if (isDl) h += `<div id="dlbox" style="display:none"></div>`;
  return h;
}

/* ---------- advice ---------- */
function tips(){
  const r = RES;
  if (!r.recs.length) return `<div class="empty">No recommendations — your ${DEV} is in good shape.</div>`;
  const safe = r.recs.filter(x => x.safe), rev = r.recs.filter(x => !x.safe);
  const max = Math.max(...r.recs.map(x => x.bytes), 1);
  let h = `<p class="lead">Pick what you want and remove it in one go. Safe items are always rebuilt by your ${DEV}; for the others, read the reason first.</p>`;
  if (safe.length) { h += `<div class="gh"><h4>Safe to remove</h4><span class="num">${size(safe.reduce((s, x) => s + x.bytes, 0))}</span></div><div class="card">${safe.map(x => recRow(x, true, max)).join('')}</div>`; }
  if (rev.length) { h += `<div class="gh"><h4>Review first</h4><span class="num">${size(rev.reduce((s, x) => s + x.bytes, 0))}</span></div><div class="card">${rev.map(x => recRow(x, true, max)).join('')}</div>`; }
  return h;
}
function recRow(x, selectable, max){
  const on = sel.rec.has(x.id);
  const kic = x.kind === 'clean' ? 'broom' : x.kind === 'app-unused' ? 'trash' : 'file';
  const kcls = x.kind === 'clean' ? 'g' : x.kind === 'app-unused' ? 'r' : 'y';
  const sel_ = selectable && x.kind !== 'big-file';
  return `<div class="row ${sel_ ? 'selrow' : ''}" ${sel_ ? `data-rec="${esc(x.id)}"` : ''}>
    ${sel_ ? `<span class="ck ${on ? 'on' : ''}">${ico('check')}</span>` : ''}
    <span class="ico ${kcls}">${ico(kic)}</span>
    <div class="tx"><b>${esc(x.title)}${x.safe ? '<span class="tag green">Safe</span>' : ''}</b><small>${esc(x.why || '')}</small></div>
    <div class="sz"><b class="num">${size(x.bytes)}</b>${max ? bar(x.bytes, max, kcls) : ''}</div>
  </div>`;
}

/* ---------- selection plan + floating bar ---------- */
function plan(){
  const apps = new Set(sel.app), cleans = new Set(sel.clean);
  RES.recs.forEach(x => { if (!sel.rec.has(x.id)) return; if (x.kind === 'app-unused') apps.add(x.target); else if (x.kind === 'clean') cleans.add(x.target); });
  const byId = {}; RES.apps.forEach(a => byId[a.id] = a);
  const cById = {}; RES.clean.forEach(c => cById[c.id] = c);
  const A = [...apps].filter(id => byId[id] && byId[id].removable).map(id => byId[id]);
  const C = [...cleans].filter(id => cById[id] && id !== 'downloads' && id !== 'allcache').map(id => cById[id]);
  const D = [...dlPick];
  const bytes = A.reduce((s, a) => s + a.size, 0) + C.reduce((s, c) => s + c.bytes, 0) + D.reduce((s, p) => s + (dlSizes[p] || 0), 0);
  return { A, C, D, n: A.length + C.length + D.length, bytes };
}
function syncFab(){
  if (!RES) return;
  document.querySelectorAll('[data-app]').forEach(el => { const c = el.querySelector('.ck'); if (c && !c.classList.contains('lock')) c.classList.toggle('on', sel.app.has(el.dataset.app)); });
  document.querySelectorAll('[data-clean]').forEach(el => { const c = el.querySelector('.ck'); if (c) c.classList.toggle('on', el.dataset.clean === 'downloads' ? dlPick.size > 0 : sel.clean.has(el.dataset.clean)); });
  document.querySelectorAll('[data-rec]').forEach(el => el.querySelector('.ck').classList.toggle('on', sel.rec.has(el.dataset.rec)));
  const p = plan();
  $('#fab').classList.toggle('show', p.n > 0);
  $('#fabN').textContent = p.n + ' selected';
  $('#fabS').textContent = p.bytes ? ('frees about ' + size(p.bytes)) : '';
  $('#fabGo').textContent = p.A.length && !p.C.length && !p.D.length ? 'Uninstall' : 'Remove';
}
function toggle(set, id){ set.has(id) ? set.delete(id) : set.add(id); syncFab(); }

/* ---------- actions ---------- */
function mrow(name, sz){ return `<div class="mrow"><span>${esc(name)}</span><b class="num">${sz}</b></div>`; }
function confirmRemove(){
  const p = plan();
  if (!p.n) return;
  let rows = '';
  p.A.forEach(a => rows += mrow(a.name, a.size ? size(a.size) : '—'));
  p.C.forEach(c => rows += mrow(c.name, size(c.bytes)));
  if (p.D.length) rows += mrow(p.D.length + ' item' + (p.D.length > 1 ? 's' : '') + ' from Downloads', size(p.D.reduce((s, x) => s + (dlSizes[x] || 0), 0)));
  const parts = [];
  if (p.A.length) parts.push(`${p.A.length} ${ANDROID ? 'app' : 'program'}${p.A.length > 1 ? 's' : ''} will be uninstalled`);
  if (p.C.length) parts.push(`${p.C.length} junk item${p.C.length > 1 ? 's' : ''} will be cleared`);
  if (p.D.length) parts.push(`${p.D.length} download${p.D.length > 1 ? 's' : ''} will be deleted`);
  const risky = p.A.length || p.D.length || p.C.some(c => !c.safe);
  modal(`<h3>Remove ${p.n} item${p.n > 1 ? 's' : ''}?</h3>
    <p>${parts.join('. ')}. This frees about <b class="gr">${size(p.bytes)}</b>.${risky ? ' Some of this cannot be undone.' : ''}</p>
    <div class="mlist">${rows}</div>
    <div class="drow"><button class="btn gho" data-mclose>Cancel</button><button class="btn dng" id="goRemove">${ico('trash')}Remove</button></div>`);
  $('#goRemove').onclick = async () => {
    closeModal();
    $('#fabGo').innerHTML = '<span class="spin"></span>';
    const msgs = [];
    const ids = p.C.map(c => c.id);
    if (p.D.length) ids.push('downloads');
    if (ids.length) {
      const r = await call('clean', {ids, pick: p.D.length ? {downloads: p.D} : {}});
      if (r.error && !(r.log && r.log.length)) toast(r.error, true); else msgs.push('Freed ' + (r.freedText || size(r.freed || 0)));
    }
    if (p.A.length) {
      const r = await call('uninstall', {ids: p.A.map(a => a.id)});
      const items = r.items || [], ok = items.filter(i => i.ok).length;
      msgs.push(ok + ' of ' + items.length + ' removed' + (ANDROID ? ' — confirm each on screen' : ''));
    }
    if (msgs.length) toast(msgs.join(' · '));
    startScan();
  };
}
function freeAll(){
  sel.clean.clear(); sel.rec.clear(); sel.app.clear();
  RES.clean.forEach(c => { if (c.safe && c.id !== 'allcache') sel.clean.add(c.id); });
  syncFab();
  confirmRemove();
}

/* ---------- downloads picker ---------- */
async function toggleDl(){
  const box = $('#dlbox'); if (!box) return;
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  box.style.display = 'block';
  if (!dlFiles) {
    box.innerHTML = '<div class="pickbar"><span><span class="spin"></span> Reading the Downloads folder…</span></div>';
    const dl = RES.clean.find(c => c.id === 'downloads');
    const r = await call('drill', {path: dl ? dl.path : ''});
    if (r.error || !r.items) { box.innerHTML = `<div class="pickbar"><span>${esc(r.error || 'Nothing to show')}</span></div>`; return; }
    dlFiles = r.items; dlFiles.forEach(f => dlSizes[f.path] = f.bytes);
  }
  paintDl();
}
function paintDl(){
  const box = $('#dlbox'); if (!box || !dlFiles) return;
  const tot = [...dlPick].reduce((s, p) => s + (dlSizes[p] || 0), 0);
  box.innerHTML = `<div class="pickbar"><span>${dlFiles.length} item${dlFiles.length === 1 ? '' : 's'} · ${dlPick.size} selected${dlPick.size ? ' · ' + size(tot) : ''}</span><button class="btn sm gho" data-dlall>All</button><button class="btn sm gho" data-dlold>Older than 30 days</button><button class="btn sm gho" data-dlnone>None</button></div>` +
    dlFiles.map(f => `<div class="pickrow" data-dlf="${esc(f.path)}"><span class="ck ${dlPick.has(f.path) ? 'on' : ''}">${ico('check')}</span><span class="ico" style="width:30px;height:30px;border-radius:9px">${ico(f.kind === 'folder' ? 'folder' : 'file')}</span><span class="tx">${esc(f.name)}</span><small>${f.mod ? ago(f.mod) : ''}</small><b class="num">${size(f.bytes)}</b></div>`).join('');
  syncFab();
  const cr = document.querySelector('[data-clean="downloads"] .tx small'); const dl = RES.clean.find(c => c.id === 'downloads');
  if (cr && dl) cr.textContent = dlPick.size ? `${dlPick.size} selected · ${size(tot)}` : dl.desc;
}

/* ---------- folder browser ---------- */
let trail = [];
const SEP = p => p.indexOf('\\') >= 0 ? '\\' : '/';
async function showDrill(path, push){
  if (push !== false) trail.push(path);
  modal(`<div class="crumb"><button class="btn sm gho" data-dback ${trail.length < 2 ? 'style="visibility:hidden"' : ''} aria-label="Back">${ico('back')}</button><p>${esc(path)}</p></div><div class="mlist" id="drillList"><div style="padding:14px;color:var(--muted)"><span class="spin"></span> Measuring…</div></div><div class="drow"><button class="btn pri" data-mclose>Close</button></div>`, true);
  const r = await call('drill', {path});
  const el = $('#drillList'); if (!el) return;
  if (r.error || !r.items) { el.innerHTML = `<div style="padding:14px;color:var(--muted)">${esc(r.error || 'Nothing to show')}</div>`; return; }
  const max = r.items.length ? r.items[0].bytes : 1;
  el.innerHTML = r.items.length ? r.items.map(b => `<div class="mrow ${b.kind === 'folder' ? 'go' : ''}" ${b.kind === 'folder' ? `data-dd="${esc(b.path)}"` : ''}><span style="flex:1">${ico(b.kind === 'folder' ? 'folder' : 'file').replace('class="i"', 'class="i" style="width:16px;height:16px;color:var(--muted)"')}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(b.name)}</span></span><span style="width:80px">${bar(b.bytes, max)}</span><b class="num" style="min-width:64px;text-align:right">${size(b.bytes)}</b></div>`).join('') : `<div style="padding:14px;color:var(--muted)">This folder is empty.</div>`;
}

/* ---------- modal ---------- */
function modal(html, wide){ const d = $('#dlg'); d.className = 'dlg' + (wide ? ' wide' : ''); d.innerHTML = html; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); trail = []; }

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const T = s => e.target.closest(s);
  if (T('[data-a="scan"]')) return startScan();
  if (T('[data-a="usage"]')) { pendingUsage = true; const r = await call('usage'); if (r && r.ok === false) { pendingUsage = false; toast('Open Settings › Apps › Special access › Usage access, and allow CoreKit.', true); } return; }
  const t = T('[data-tab]'); if (t) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (T('[data-a="freeall"]')) return freeAll();
  if (T('[data-freeup]')) { e.stopPropagation(); await call('freeup'); return; }
  const af = T('[data-af]'); if (af) { appF = af.dataset.af; appLimit = 150; paint(); return; }
  if (T('[data-more]')) { appLimit += 200; paintApps(); return; }
  const sa = T('[data-showall]'); if (sa) { showAll[sa.dataset.showall] = true; paint(); return; }
  const app = T('[data-app]'); if (app) { const a = RES.apps.find(x => x.id === app.dataset.app); if (a && a.removable) toggle(sel.app, a.id); return; }
  if (T('[data-dl]')) { e.stopPropagation(); return toggleDl(); }
  const dlf = T('[data-dlf]'); if (dlf) { const p = dlf.dataset.dlf; dlPick.has(p) ? dlPick.delete(p) : dlPick.add(p); paintDl(); return; }
  if (T('[data-dlall]')) { (dlFiles || []).forEach(f => dlPick.add(f.path)); paintDl(); return; }
  if (T('[data-dlnone]')) { dlPick.clear(); paintDl(); return; }
  if (T('[data-dlold]')) { const cut = Date.now() / 1000 - 30 * 86400; dlPick.clear(); (dlFiles || []).forEach(f => { if (f.mod && f.mod < cut) dlPick.add(f.path); }); paintDl(); return; }
  const cl = T('[data-clean]'); if (cl) { if (cl.dataset.clean === 'downloads') return toggleDl(); if (cl.dataset.clean === 'allcache') return; toggle(sel.clean, cl.dataset.clean); return; }
  const rc = T('[data-rec]'); if (rc) { toggle(sel.rec, rc.dataset.rec); return; }
  if (T('[data-selsafe]')) { RES.clean.forEach(c => { if (c.safe && c.id !== 'allcache') sel.clean.add(c.id); }); paint(); return; }
  if (T('[data-selvis]')) { appList().forEach(a => { if (a.removable) sel.app.add(a.id); }); paintApps(); return; }
  const dd = T('[data-dd]'); if (dd) return showDrill(dd.dataset.dd);
  if (T('[data-dback]')) { trail.pop(); const prev = trail.pop(); if (prev) showDrill(prev); return; }
  const drill = T('[data-drill]'); if (drill) { trail = []; return showDrill(drill.dataset.drill); }
  if (T('[data-mclose]')) return closeModal();
});
$('#fabClear').onclick = () => { sel.app.clear(); sel.clean.clear(); sel.rec.clear(); dlPick.clear(); if (RES) { paint(); if (dlFiles) paintDl(); } };
$('#fabGo').onclick = () => confirmRemove();
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('input', e => { if (e.target.id === 'appSearch') { appQ = e.target.value; appLimit = 150; paintApps(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'appSort') { appS = e.target.value; paintApps(); }
  if (e.target.id === 'appDrive') { appD = e.target.value; appLimit = 150; paint(); }
});

startScan();
</script>
</body>

# One pipeline for every platform: each push to main builds Windows, Linux and Android
# from the same commit and publishes them together as release v<VERSION>.
name: Build all platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Go tests, UI scripts)
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: echo "android=$([ -f android/settings.gradle.kts ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: false }
      - name: Shared UI is up to date
        run: |
          python3 ui/src/build_assets.py
          git diff --exit-code ui/net.html || (echo "::error::run python3 ui/src/build_assets.py and commit ui/net.html" && exit 1)
      - name: UI JavaScript syntax
        run: |
          for f in ui/*.html; do
            python3 - "$f" > /tmp/ui.js <<'PY'
          import re, sys
          h = open(sys.argv[1], encoding="utf-8").read()
          print("\n;\n".join(m for m in re.findall(r"<script>([\s\S]*?)</script>", h)))
          PY
            node --check /tmp/ui.js && echo "ok $f"
          done
      - name: Go vet + tests
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && echo "::error::gofmt needed" && exit 1)
          go vet ./...
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet -unsafeptr=false ./...

  windows:
    name: Windows (CoreKit.exe)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: false }
      - name: Version resources
        run: |
          pip install --quiet pillow
          python3 desktop/build/gen_syso.py
      - name: Build
        run: |
          V=$(cat VERSION)
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.appVersion=$V" -o dist/CoreKit.exe ./desktop
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/CoreKit.exe }

  android:
    name: Android (CoreKit.apk)
    needs: checks
    if: needs.checks.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: false }
      - name: Shared Go code + Xray engine for Android (arm64)
        run: |
          set -e
          J=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$J"
          V=$(cat VERSION)
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-w -X main.appVersion=$V" -o "$J/libcorekit.so" ./desktop
          base=https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          curl -fsSL -o /tmp/xray.zip "$base"
          want=$(curl -fsSL "$base.dgst" | sed -n 's/^SHA2-256= *//p' | tr -d '\r ')
          got=$(sha256sum /tmp/xray.zip | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "::error::Xray checksum mismatch"; exit 1; }
          unzip -o -j /tmp/xray.zip xray -d /tmp/xr
          cp /tmp/xr/xray "$J/libxray.so"
          ls -la "$J"
          # Google Play: native code must work on 16 KB memory pages (LOAD segments aligned to >= 16 KB)
          for f in "$J"/*.so; do
            a=$(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}' | sort -u)
            echo "$(basename "$f") LOAD align: $a"
            for x in $a; do [ $((x)) -ge 16384 ] || { echo "::error::$(basename "$f") is not 16 KB aligned ($x)"; exit 1; }; done
          done
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        env:
          CK_KEYSTORE_B64: ${{ secrets.CK_KEYSTORE_B64 }}
          CK_KEYSTORE_PASS: ${{ secrets.CK_KEYSTORE_PASS }}
        run: |
          mkdir -p ../dist
          if [ -n "$CK_KEYSTORE_B64" ]; then
            echo "$CK_KEYSTORE_B64" | base64 -d > release.jks
            gradle --no-daemon assembleRelease bundleRelease
            # Google Play takes the App Bundle (.aab); the .apk is for direct installs
            cp app/build/outputs/bundle/release/*.aab ../dist/CoreKit.aab
            unzip -p ../dist/CoreKit.aab 'META-INF/*.RSA' | openssl pkcs7 -inform DER -print_certs -noout | head -1
            # Google Play warnings: the bundle must carry the R8 map and the native symbol tables
            unzip -l ../dist/CoreKit.aab | grep -E 'BUNDLE-METADATA/(com.android.tools.build.obfuscation|com.android.tools.build.debugsymbols)/' \
              || { echo "::error::.aab is missing the R8 map or native symbols"; exit 1; }
            unzip -l ../dist/CoreKit.aab | grep -q 'com.android.tools.build.obfuscation/proguard.map' || { echo "::error::no R8 map in .aab"; exit 1; }
            unzip -l ../dist/CoreKit.aab | grep -q 'com.android.tools.build.debugsymbols/' || { echo "::error::no native symbols in .aab"; exit 1; }
          else
            # no upload key: a test-signed .apk only (Google Play refuses test-signed bundles)
            echo "::warning::No signing key (secrets CK_KEYSTORE_B64 / CK_KEYSTORE_PASS): APK is test-signed and no .aab is made"
            gradle --no-daemon assembleRelease
          fi
          cp app/build/outputs/apk/release/*.apk ../dist/CoreKit.apk
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "dist/CoreKit.*" }

  release:
    name: Publish release v<VERSION>
    needs: [windows, android]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.windows.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          ls -la dist
          NOTES="CoreKit v$V — built from ${GITHUB_SHA::7}. Windows: CoreKit.exe · Android: CoreKit.apk (direct install) · CoreKit.aab (Google Play upload)"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/* --clobber
            gh release edit "v$V" --notes "$NOTES"
          else
            gh release create "v$V" dist/* --title "CoreKit v$V" --notes "$NOTES" --target "$GITHUB_SHA"
          fi

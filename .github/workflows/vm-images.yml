# Builds the downloads for CoreKit's Virtual Environment and publishes them on the
# "vm-images" pre-release (not on every push):
#   android9-lite.iso  slimmed Android-x86 9.0-r2 (tools/vm/slim.sh)
#   data8g.ckt         empty 8 GB data-disk template (tools/vm/mktemplate.py)
#   qemu-win64.zip     QEMU for Windows (from qemu.weilnetz.de), trimmed
# Sources: Android-x86 https://www.android-x86.org (Apache 2.0, Linux kernel GPLv2),
#          QEMU https://www.qemu.org (GPLv2). Their source code is available there.
name: Virtual Environment images
on:
  workflow_dispatch:
  push:
    branches: [vm-images-build]
permissions:
  contents: write
jobs:
  android9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 libarchive-tools squashfs-tools xorriso e2fsprogs
          sudo chmod 666 /dev/kvm || true
      - uses: actions/cache@v4
        id: a9
        with: { path: /tmp/a9.iso, key: android-x86_64-9.0-r2-f7eb8fc5 }
      - name: Official Android-x86 9.0-r2
        if: steps.a9.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            curl -fL -A corekit -C - --connect-timeout 20 --speed-limit 200000 --speed-time 25 -o /tmp/a9.iso "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download" && break
            echo "retry $i"; sleep 3
          done
          echo "f7eb8fc56f29ad5432335dc054183acf086c539f3990f0b6e9ff58bd6df4604e  /tmp/a9.iso" | sha256sum -c
      - run: mkdir -p out && TEST_APK=$PWD/test.apk bash tools/vm/slim.sh /tmp/a9.iso out/android9-lite.iso
      - run: python3 tools/vm/mktemplate.py out/data8g.ckt 8
      - name: Boot test
        timeout-minutes: 30
        run: python3 -u tools/vm/probe2.py $PWD/out/android9-lite.iso "" kvm 10 $PWD/test.apk
      - uses: actions/upload-artifact@v4
        with: { name: android9, path: out/ }
  qemu-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf binutils
      - name: QEMU for Android (arm64, from Termux packages), pinned as a release file
        run: |
          python3 tools/vm/termux_qemu.py /tmp/qa/lib /tmp/qa/share
          mkdir -p out && tar -C /tmp/qa -czf out/qemu-android-arm64.tar.gz lib share
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: qemuandroid, path: out/ }
  prestart:
    needs: [android9, qemu-android]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools e2fsprogs
      - uses: actions/download-artifact@v4
        with: { name: qemuandroid, path: /tmp/qa }
      - uses: actions/download-artifact@v4
        with: { name: android9, path: /tmp/img }
      - name: Start once in the phone emulator and save it
        timeout-minutes: 340
        run: |
          mkdir -p /tmp/q /tmp/vmps && tar -C /tmp/q -xzf /tmp/qa/qemu-android-arm64.tar.gz
          docker run -d --name tx --network host -v /tmp/q:/q -v /tmp/vmps:/tmp/vmps -v /tmp/img:/tmp/img termux/termux-docker:aarch64 sleep infinity
          sleep 5
          QHOST=/tmp/q VMW=/tmp/vmps python3 -u tools/vm/prestart.py /tmp/img/android9-lite.iso "docker exec tx env LD_LIBRARY_PATH=/q/lib TMPDIR=/tmp/vmps /q/lib/libqemu.so -L /q/share" out 320
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: prestart, path: out/ }
      - if: always()
        run: tail -c 3000 prestart-serial0.log || true
  qemu-win:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full zip
      - name: QEMU for Windows
        run: |
          set -e
          f=$(curl -fsSL https://qemu.weilnetz.de/w64/ | grep -oE 'qemu-w64-setup-[0-9]+\.exe' | sort -u | tail -1)
          echo "using $f"
          curl -fsSL -o /tmp/q.exe "https://qemu.weilnetz.de/w64/$f"
          curl -fsSL "https://qemu.weilnetz.de/w64/${f%.exe}.sha512" -o /tmp/q.sha512 && (cd /tmp && sed "s/ .*/  q.exe/" q.sha512 | sha512sum -c) || echo "no sha512 published"
          mkdir -p /tmp/x && 7z x -y -o/tmp/x /tmp/q.exe >/dev/null
          mkdir -p /tmp/z/share
          cp /tmp/x/qemu-system-x86_64.exe /tmp/z/
          cp /tmp/x/*.dll /tmp/z/
          for b in bios-256k.bin kvmvapic.bin linuxboot_dma.bin linuxboot.bin vgabios-stdvga.bin vgabios.bin efi-virtio.rom efi-e1000.rom pxe-virtio.rom multiboot_dma.bin; do
            [ -f /tmp/x/share/$b ] && cp /tmp/x/share/$b /tmp/z/share/ || ([ -f /tmp/x/$b ] && cp /tmp/x/$b /tmp/z/share/) || true
          done
          [ -d /tmp/x/share/keymaps ] && cp -r /tmp/x/share/keymaps /tmp/z/share/ || true
          printf 'QEMU %s for Windows (https://qemu.weilnetz.de), repackaged for CoreKit.\nQEMU is free software under the GNU GPL v2; source: https://www.qemu.org/download/#source\n' "$f" > /tmp/z/README-CoreKit.txt
          ls -la /tmp/z /tmp/z/share; du -sh /tmp/z
          mkdir -p out && (cd /tmp/z && zip -q -9 -r $GITHUB_WORKSPACE/out/qemu-win64.zip .)
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: qemuwin, path: out/ }
  qemu-win-test:
    needs: qemu-win
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: qemuwin, path: q }
      - shell: pwsh
        run: |
          Expand-Archive q/qemu-win64.zip -DestinationPath qx
          ./qx/qemu-system-x86_64.exe -version
          ./qx/qemu-system-x86_64.exe -accel help
  publish:
    needs: [android9, qemu-android, qemu-win-test, prestart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && ls -la && sha256sum * | tee SHA256SUMS
          stat -c '%n %s' * | tee SIZES
          gh release view vm-images -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create vm-images -R "$GITHUB_REPOSITORY" --prerelease --title "Virtual Environment images" --notes "Downloads used by CoreKit's Virtual Environment. Android-x86 (android-x86.org, Apache 2.0 / Linux kernel GPLv2) and QEMU (qemu.org, GPLv2); source code is available from those projects."
          gh release upload vm-images -R "$GITHUB_REPOSITORY" * --clobber

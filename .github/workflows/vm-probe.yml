name: VM probe (experiment)
on:
  push:
    branches: [vm-exp*]
jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 libarchive-tools squashfs-tools xorriso e2fsprogs
          sudo chmod 666 /dev/kvm
      - name: Official Android 9
        run: curl -fL -A corekit -o /tmp/a9.iso "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download"
      - name: Slim it
        run: TEST_APK=$PWD/test.apk bash tools/vm/slim.sh /tmp/a9.iso $PWD/android9-lite.iso; ls -la test.apk
      - name: Boot test (KVM)
        run: python3 -u tools/vm/probe2.py $PWD/android9-lite.iso "" kvm 10 $PWD/test.apk
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slim
          path: |
            android9-lite.iso
            test.apk
            *.log
  arm-tcg:
    needs: slim
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf binutils libarchive-tools e2fsprogs
      - run: python3 tools/vm/termux_qemu.py /tmp/q/out /tmp/q/share
      - uses: actions/download-artifact@v4
        with: { name: slim, path: /tmp/img }
      - name: Termux (bionic) container
        run: |
          mkdir -p /tmp/vm2
          docker run -d --name tx --network host -v /tmp/q:/q -v /tmp/vm2:/tmp/vm2 -v /tmp/img:/tmp/img termux/termux-docker:aarch64 sleep infinity
          sleep 5
          docker exec tx env LD_LIBRARY_PATH=/q/out /q/out/libqemu.so -version
      - name: Boot test (no KVM, like a phone)
        run: VMW=/tmp/vm2 python3 -u tools/vm/probe2.py /tmp/img/android9-lite.iso "docker exec tx env LD_LIBRARY_PATH=/q/out TMPDIR=/tmp/vm2 /q/out/libqemu.so -L /q/share" "tcg,thread=multi" 55 /tmp/img/test.apk
        timeout-minutes: 75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-logs
          path: "*.log"

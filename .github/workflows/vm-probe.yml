name: VM probe (experiment)
on:
  push:
    branches: [vm-exp*]
jobs:
  slim:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        comp: [gzip]
        net: [wifi]
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 libarchive-tools squashfs-tools xorriso e2fsprogs
          sudo chmod 666 /dev/kvm
      - name: Official Android 9
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fL -A corekit -C - --connect-timeout 20 --speed-limit 200000 --speed-time 25 -o /tmp/a9.iso "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download" && break
            echo "retry $i"; sleep 3
          done
          echo "f7eb8fc56f29ad5432335dc054183acf086c539f3990f0b6e9ff58bd6df4604e  /tmp/a9.iso" | sha256sum -c
        timeout-minutes: 25
      - name: ARM support files
        run: |
          for v in 9_y 9_z; do curl -fsSL --max-time 120 -o /tmp/houdini$v.sfs "http://zebra-mirror.ddscentral.org/dl.android-x86.org/houdini/$v/houdini.sfs" && sha256sum /tmp/houdini$v.sfs && ls -la /tmp/houdini$v.sfs || echo "no $v"; done
      - name: Where do the ARM-support links point?
        run: for u in http://t.cn/EJrmzZv http://t.cn/EJrmYMH http://t.cn/EJrmrA7 http://tinyurl.com/y3nagyza http://tinyurl.com/y6azmjas http://tinyurl.com/y6g6cx27; do echo "== $u"; curl -sIL --max-time 20 "$u" | grep -iE '^(HTTP|location|content-length)' || true; done
      - name: Slim it
        run: NETMODE=${{ matrix.net }} SQ_COMP=${{ matrix.comp }} TEST_APK=$PWD/test.apk bash tools/vm/slim.sh /tmp/a9.iso $PWD/android9-lite.iso; ls -la test.apk
      - name: Boot test (KVM)
        run: NETMODE=${{ matrix.net }} python3 -u tools/vm/probe2.py $PWD/android9-lite.iso "" kvm 10 $PWD/test.apk
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slim-${{ matrix.comp }}-${{ matrix.net }}
          path: |
            android9-lite.iso
            test.apk
            *.log
